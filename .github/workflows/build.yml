name: Build

on:
  workflow_dispatch:
  push:
    branches: [dev, main, 'sync/**']
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      # Fetches the pinned Celeritas jar from maven.outlands.top and checks its SHA-256
      # (docs/celeritas/PIN.md), so an unreachable or moved pin fails here, by name.
      - name: Check the Celeritas pin
        run: ./gradlew verifyCeleritasPin

      # Fetches the pinned S8TNLib mod jar from the assets of its GitHub release v<s8tnlib_version>
      # and checks its SHA-256 (docs/FORK.md).
      - name: Check the S8TNLib pin
        run: ./gradlew verifyS8tnlibPin

      # Compiles and tests, then checks the mod jar (verifyDistributedJar), that no S8TNLib jar is
      # on the dev client's class path (verifyRunClasspath) and the patches' anchors in production
      # names (verifyProductionAnchors).
      - name: Build
        run: ./gradlew build

      # The mod jar and sources jar of every successful build. A release tag's run supplies the jars
      # attached to the GitHub release, and a local build of the same commit is compared against them.
      - name: Upload the jars
        uses: actions/upload-artifact@v7
        with:
          name: demonica-jars
          path: build/libs/Demonica-*.jar
          if-no-files-found: error

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: build/reports/tests
