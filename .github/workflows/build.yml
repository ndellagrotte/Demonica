name: Build

on:
  workflow_dispatch:
  push:
    branches: [main, 'develop/**', 'sync/**']
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # Full history and tags: Conventions' Versioning derives the version from git tags.
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      # Fetches the pinned Celeritas jar from maven.outlands.top and checks its SHA-256
      # (docs/celeritas/PIN.md), so an unreachable or moved pin fails here, by name. It also
      # downloads the release asset the mod jar bundles from the Celeritas-auto-build GitHub
      # release and checks that it is exactly celeritas_asset_sha256. Every Gradle step asks
      # GitHub's API for S8TNLib's latest release (docs/FORK.md); the token lifts the anonymous
      # rate limit.
      - name: Check the Celeritas pin
        run: ./gradlew verifyCeleritasPin verifyBundledCeleritasPin
        env:
          GITHUB_TOKEN: ${{ github.token }}

      # Compiles and tests, then checks the mod jar, its Celeritas pin and the Celeritas it bundles
      # (verifyDistributedJar), the diagnostics jar (verifyDiagnosticsJar, verifyDiagnosticsRemap)
      # and that the dev client gets GTNHLib only from the merged mod classes, not from an S8TNLib
      # jar (verifyRunClasspath).
      - name: Build
        run: ./gradlew build
        env:
          GITHUB_TOKEN: ${{ github.token }}

      # The distributable mod jar build/libs/Demonica-<version>.jar (from reobfJar; dev jars go to
      # build/devlibs), the diagnostics jar (Demonica-diagnostics-<version>.jar) and the sources jar
      # of every successful build. The version comes from git tags (Conventions Versioning), not
      # gradle.properties.
      - name: Upload the jars
        uses: actions/upload-artifact@v7
        with:
          name: demonica-jars
          path: build/libs/Demonica-*.jar
          if-no-files-found: error

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: |
            build/reports/tests
            diagnostics/build/reports/tests
