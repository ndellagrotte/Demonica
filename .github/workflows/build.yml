name: Build

on:
  workflow_dispatch:
  push:
    branches: [dev, main, 'sync/**']
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      # Fetches the pinned Celeritas jar from maven.outlands.top and checks its SHA-256
      # (docs/celeritas/PIN.md), so an unreachable or moved pin fails here, by name. Every Gradle
      # step asks GitHub's API for S8TNLib's latest release (docs/FORK.md); the token lifts the
      # anonymous rate limit.
      - name: Check the Celeritas pin
        run: ./gradlew verifyCeleritasPin
        env:
          GITHUB_TOKEN: ${{ github.token }}

      # Compiles and tests, then checks the mod jar and its Celeritas pin (verifyDistributedJar), the
      # diagnostics jar (verifyDiagnosticsJar, verifyDiagnosticsRemap) and that the dev client gets
      # GTNHLib only from the merged mod classes, not from an S8TNLib jar (verifyRunClasspath).
      - name: Build
        run: ./gradlew build
        env:
          GITHUB_TOKEN: ${{ github.token }}

      # The mod jar, the diagnostics jar (Demonica-diagnostics-<version>.jar) and the sources jar of
      # every successful build. A release tag's run supplies the jars
      # attached to the GitHub release, and a local build of the same commit is compared against them.
      - name: Upload the jars
        uses: actions/upload-artifact@v7
        with:
          name: demonica-jars
          path: build/libs/Demonica-*.jar
          if-no-files-found: error

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: |
            build/reports/tests
            diagnostics/build/reports/tests
