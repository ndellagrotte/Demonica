name: Build

on:
  workflow_dispatch:
  push:
    branches: [dev, main, 'sync/**']
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      # Fetches the pinned Celeritas jar from maven.outlands.top and checks its SHA-256
      # (docs/celeritas/PIN.md), so an unreachable or moved pin fails here, by name.
      - name: Check the Celeritas pin
        run: ./gradlew verifyCeleritasPin

      # Compiles and tests, then checks the mod jar (verifyDistributedJar) and the patches'
      # anchors in production names (verifyProductionAnchors).
      - name: Build
        run: ./gradlew build

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: build/reports/tests
