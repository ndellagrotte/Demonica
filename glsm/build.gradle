// GLSM, the GL state manager, with the LWJGL service abstraction and its LWJGL 3 backend.
// Merged into the Demonica mod jar.
plugins {
    id 'java-library'
}

repositories {
    mavenCentral()
}

sourceSets {
    main {
        java {
            srcDir 'src/main/java'
            srcDir '../src/lwjglCommon/java'
            srcDir '../src/lwjgl3/java'
        }
    }
}

dependencies {
    // glsl-transformer (AGPL-3.0; docs/glsl-transformer_adoption), which replaced TauMC's glsl-transformation-lib in
    // Step 11. Its POM declares the full ANTLR tool in compile scope; only the runtime is needed, at 4.13.1, the version
    // its generated lexer and parser check (RuntimeMetaData.checkVersion("4.13.1", ...)) and its POM names. The
    // same coordinate is in the root build's contain list.
    implementation('io.github.douira:glsl-transformer:3.0.0-pre3') {
        transitive = false
    }
    implementation 'org.antlr:antlr4-runtime:4.13.1'
}

tasks.named('jar', Jar) {
    // com.gtnewhorizons.angelica.Tags reads Implementation-Version from the manifest.
    manifest.attributes(
        'Implementation-Title': 'Demonica GLSM',
        'Implementation-Version': project.version
    )
}
