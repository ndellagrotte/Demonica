pluginManagement {
    repositories {
        maven {
            url = 'https://maven.cleanroommc.com'
        }
        gradlePluginPortal()
    }
}

plugins {
    // Adds Maven Central, Cleanroom's Maven (the only source of com.cleanroommc, top.outlands, zone.rong,
    // net.minecraftforge and de.oceanlabs.mcp) and Mojang's libraries to every project.
    id 'com.cleanroommc.cleanroomgradle.settings' version '0.22.0'
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}

rootProject.name = 'Demonica'

// GLSM and the Iris tree (shader) are merged into the Demonica mod jar. So is GTNHLib, from S8TNLib's latest
// release (build.gradle). diagnostics is the companion jar, Demonica-diagnostics-<version>.jar.
include 'glsm', 'shader', 'diagnostics'
