pluginManagement {
    repositories {
        gradlePluginPortal() {
            content {
                excludeGroup('org.apache.logging.log4j')
            }
        }
        mavenCentral()
        maven {
            url = 'https://maven.arcseekers.com/releases'
        }
        maven {
            url = 'https://maven.minecraftforge.net/'
        }
        maven {
            url = 'https://maven.fabricmc.net/'
        }
        maven {
            url = 'https://maven.wagyourtail.xyz/releases'
        }
        maven {
            url = 'https://maven.wagyourtail.xyz/snapshots'
        }
    }
}

plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}

rootProject.name = 'Demonica'

include 'glsm', 'GTNHLib', 'celeritas-common'
// Vendored verbatim from Actinium (see vendor/README.md); compile-only, never published.
project(':GTNHLib').projectDir = file('vendor/GTNHLib')
project(':celeritas-common').projectDir = file('vendor/celeritas-common')
