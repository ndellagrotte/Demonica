// The Iris shader pipeline (net.coderbot, net.irisshaders, kroppeb) and the Celeritas seam types
// (com.demonica.celeritas). Merged into the Demonica mod jar. It compiles against the pinned
// Celeritas mod through the root project's compile classpath.
plugins {
    id 'java-library'
}

dependencies {
    api project(':glsm')
    // GTNHLib, from S8TNLib (gradle.properties), which the Iris tree also uses directly.
    api "com.s8tnlib:s8tnlib:${property('s8tnlib_version')}"
}
