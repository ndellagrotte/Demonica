# Gradle Properties
# Two jars are remapped (the mod and the diagnostics), besides the 22 mods Unimined remaps: 4G ran out of heap and
# stalled the remap.
org.gradle.jvmargs = -Xmx6G -XX:+UseZGC
org.gradle.workers.max = 2
org.gradle.caching = true
# Subprojects resolve the root project's compile classpath, and Unimined is not
# configuration-cache safe: parallel execution and the configuration cache stay off.
org.gradle.parallel = false
org.gradle.configuration-cache = false

# Testing
show_testing_output = false

# Demonica
demonica_group = com.demonica
demonica_version = 0.6.0-SNAPSHOT

# Celeritas: the upstream 1.12.2 mod Demonica runs on (docs/celeritas/PIN.md). Built from the
# upstream commit below by kappa-maintainer/Celeritas-auto-build and resolved from
# maven.outlands.top. The SHA-256 list pins the exact jars: the Maven artifact, then the
# GitHub release asset, whose entries are identical except for the manifest's Class-Path.
celeritas_sha = 9b661b70ecaf84c39052e8fbc51c875ba37e739d
celeritas_version = 2.5.0-autobuild.9b661b70
celeritas_sha256 = 5bf123a6da6190f6e061cd3fd069a2bddcbf6ebf57894381b6c888c06a94f982,80f07935d86d364fd9b80297f4bc87d47f3a49209f589091b554a7332b56a909

# S8TNLib: GTNHLib for Demonica, a separate mod that players install (docs/FORK.md). The build
# downloads s8tnlib-<version>.jar from the assets of S8TNLib's GitHub release v<version>, and
# verifyS8tnlibPin checks its SHA-256.
s8tnlib_version = 0.3.0
s8tnlib_sha256 = ba70862c038c887adc3827e45398a8dc870b5879be71f7aa2840fb9a74aca146
