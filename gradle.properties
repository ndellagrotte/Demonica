# Gradle
# The build script asks GitHub for S8TNLib's latest release and reads the project model while tasks run (the extrapath,
# the jar manifest, the verify* tasks), so the configuration cache stays off until that is converted.
org.gradle.configuration-cache = false
# :glsm, :shader and :diagnostics compile against the root project's resolved compile classpath
# (sharedMinecraftCompileClasspath), which is not safe to resolve from another project in parallel.
org.gradle.parallel = false
org.gradle.caching = true
# The deobf transforms of the ~20 compile-only mods and the reobf of two jars share the daemon with the compiles.
org.gradle.jvmargs = -Xmx6G -XX:+UseZGC

# Cleanroom
# This template only works with Cleanroom 0.7.0 and above
cleanroom_version = 0.7.4-alpha

# Mod Information
# The version is computed from git tags by Versioning, run `gradlew -q printVersion` to see it
# Tag `v1.0.0` to release it. A suffix on the tag picks the release type:
#   1.0.0-alpha    = alpha
#   1.0.0-beta     = beta
#   1.0.0-rc       = release candidate, uploaded to CurseForge and Modrinth as beta
#   1.0.0-release  = release, same as the bare `1.0.0`
# Untagged builds inherit the type of the highest staged tag in the same major version,
# else beta below 1.0.0 and release from there on
root_package = com.demonica
mod_id = demonica
mod_name = Demonica

# Mod Metadata (Optional)
# Every property in the two sections above and below is a Token Envoy token, see tokens.properties
mod_description = Shader packs for Minecraft 1.12.2 on Cleanroom, running on Celeritas.
mod_url = https://github.com/ndellagrotte/Demonica
mod_update_json =
# Delimit authors with commas. When set, they also become the copyright holder in LICENSE and HEADER
mod_authors = Nicholas DellaGrotte
mod_credits = Actinium (DHJComical, embeddedt), Celeritas (embeddedt), Iris, Angelica and GLSM, GTNHLib, glsl-transformer (douira), ShadersMod (daxnitro, id_miner, karyonix)
mod_logo_path = assets/actinium/icon.png

# Run Configurations
# Delimit multiple JVM arguments with spaces
minecraft_username = Developer
extra_jvm_args =

# Dependencies
# Demonica has no HEI integration: HEI is neither on the classpath nor a dependency.
depend_on_hei = false

# Access Transformers (Optional)
# File names under src/main/resources/META-INF, delimited with spaces, e.g. modid_at.cfg
access_transformers = demonica_at.cfg

# Coremod (Optional)
# Fully-qualified name of the class implementing IFMLLoadingPlugin
coremod_plugin_class = com.demonica.mixins.MixinEarly
# Set to false when the coremod jar has no @Mod class
coremod_includes_mod = true

# Mixin (Optional)
# Name of the refmap the Mixin config points at, e.g. mixins.modid.refmap.json
# Setting it adds the Mixin annotation processors and puts the refmap in both jars. :diagnostics inherits this value
# (a subproject's own gradle.properties is not read for it) and points its compileJava at its own refmap.
cg.userdev.refmap = mixins.demonica-refmap.json

# Publishing (Optional), ran by the release workflow through `publishMods`
# Provide secrets: CURSEFORGE_TOKEN, MODRINTH_TOKEN
# The CurseForge project ID is the numerical ID and not the slug
curseforge_project_id =
modrinth_project_id =

# Conventions (https://github.com/CleanroomMC/Conventions#configuration)
# One of: free (MIT), open (LGPLv3), visible (CleanroomMC License), none
# Demonica is AGPL-3.0 (LICENSE), which Conventions does not offer: none writes no LICENSE or HEADER.
conventions.license = none
conventions.javaMajor = 25
# Code Style
# When true, `gradlew build` fails on a violation. The `Apply` tasks work either way
# Checkstyle, with the rules in checkstyle.xml. It also requires the license header on every Java file
enable_checkstyle = false
# FormatJ and ClearSkies, fix with `gradlew clearSkiesApply formatJavaApply`. Off: much of the tree is ported
# Iris/Angelica code synced by upstream commit, which a reformat would make unsyncable.
enable_formatting = false

# The branch release tags are cut from
versioning.releaseBranch = main

# Testing
# true: show the tests' standard output and error
show_testing_output = false

# Celeritas: the upstream 1.12.2 mod Demonica runs on (docs/celeritas/PIN.md). Built from the
# upstream commit below by kappa-maintainer/Celeritas-auto-build and resolved from
# maven.outlands.top. The SHA-256 list pins the exact jars: the Maven artifact, then the
# GitHub release asset, whose entries are identical except for the manifest's Class-Path.
celeritas_sha = d94ec1e59df7b5fe38ee76f1bdcb03f851587aa4
celeritas_version = 2.5.0-autobuild.d94ec1e5
celeritas_sha256 = 7c159117fe23e4545bf499a708276ccd624905bba97063bd5c01b90d7b00afdb,7d380743016c3c12a473a48ef15fba87812f66acf6ac19cd6251ab3055ba4471
# The Celeritas-auto-build GitHub release the mod jar bundles (byte for byte, ContainedDeps), its asset, and that
# asset's SHA-256 (also listed in celeritas_sha256). Moving the pin: docs/celeritas/PIN.md.
celeritas_release = commit-d94ec1e59df7b5fe38ee76f1bdcb03f851587aa4-20261014T021746
celeritas_release_asset = 01-celeritas-forge-mc12.2-2.5.0-dev.jar
celeritas_asset_sha256 = 7d380743016c3c12a473a48ef15fba87812f66acf6ac19cd6251ab3055ba4471
