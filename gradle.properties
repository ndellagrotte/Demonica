# Gradle Properties
# Two jars are remapped (the mod and the diagnostics), besides the 22 mods Unimined remaps: 4G ran out of heap and
# stalled the remap.
org.gradle.jvmargs = -Xmx6G -XX:+UseZGC
org.gradle.workers.max = 2
org.gradle.caching = true
# Subprojects resolve the root project's compile classpath, and Unimined is not
# configuration-cache safe: parallel execution and the configuration cache stay off.
org.gradle.parallel = false
org.gradle.configuration-cache = false

# Testing
show_testing_output = false

# Demonica
demonica_group = com.demonica
demonica_version = 0.8.0-SNAPSHOT

# Celeritas: the upstream 1.12.2 mod Demonica runs on (docs/celeritas/PIN.md). Built from the
# upstream commit below by kappa-maintainer/Celeritas-auto-build and resolved from
# maven.outlands.top. The SHA-256 list pins the exact jars: the Maven artifact, then the
# GitHub release asset, whose entries are identical except for the manifest's Class-Path.
celeritas_sha = d94ec1e59df7b5fe38ee76f1bdcb03f851587aa4
celeritas_version = 2.5.0-autobuild.d94ec1e5
celeritas_sha256 = 7c159117fe23e4545bf499a708276ccd624905bba97063bd5c01b90d7b00afdb,7d380743016c3c12a473a48ef15fba87812f66acf6ac19cd6251ab3055ba4471
# The Celeritas-auto-build GitHub release the mod jar bundles (byte for byte, ContainedDeps), its asset, and that
# asset's SHA-256 (also listed in celeritas_sha256). Moving the pin: docs/celeritas/PIN.md.
celeritas_release = commit-d94ec1e59df7b5fe38ee76f1bdcb03f851587aa4-20261014T021746
celeritas_release_asset = 01-celeritas-forge-mc12.2-2.5.0-dev.jar
celeritas_asset_sha256 = 7d380743016c3c12a473a48ef15fba87812f66acf6ac19cd6251ab3055ba4471
