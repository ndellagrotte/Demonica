# Hand-written mini-corpus case (docs/IRIS_PORTING_PLAN.md, item 3.2): a #version 120 composite fragment shader that declares and reads both uniform sampler2D texture and uniform sampler2D gcolor, in two declarations; Iris (CommonTransformer getGtextureRenameTargets) keeps one declaration, gcolor's, renamed gtexture, and every use of either name reads gtexture. The reference is out.douira.*, recorded from the glsl-transformer engine before the port
domain=iris
patch=COMPOSITE
parameters=TextureStageParameters
textureStage=COMPOSITE_AND_FINAL
textureMap=0
stages=vertex,fragment
glsl.maxVersion=460
glsl.ssbo=true
glsl.imageLoadStore=true
versionHoisting=std430,iimage,uimage,imageLoad,imageStore,uint,uvec2,uvec3,uvec4,flat
shadowBounds.instrumentation=false
shadowBounds.binding=-1
files.in=in.vertex.glsl,in.fragment.glsl
engine=douira
outcome=ok
source=hand-written
