# Hand-written mini-corpus case (docs/glsl-transformer_adoption/ADOPTION_PLAN.md, Step 7b verification follow-up, report S7b-hardening.md): a line comment holding "/*" on an #extension line, in the leading directive block (fragment) and in a function body (vertex); the Step 7b pre-pass read the "/*" as the start of a block comment and blanked the program text after it
domain=iris
