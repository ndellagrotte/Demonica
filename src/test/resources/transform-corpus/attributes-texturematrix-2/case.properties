# Hand-written mini-corpus case (docs/IRIS_PORTING_PLAN.md, item 3.4): a gbuffers program that reads gl_TextureMatrix[2] (the lightmap matrix under its second unit, as gl_MultiTexCoord2 aliases gl_MultiTexCoord1) and [3]; [2] becomes iris_LightmapTextureMatrix like [1] (Iris VanillaCoreTransformer glTextureMatrix2), [3] keeps the catch-all identity. The reference is out.douira.*, recorded from the glsl-transformer engine before the port
domain=iris
patch=ATTRIBUTES
parameters=AttributeParameters
textureStage=GBUFFERS_AND_SHADOW
hasGeometry=false
inputs.texture=true
inputs.lightmap=true
inputs.color=true
textureMap=null
stages=vertex,fragment
glsl.maxVersion=460
glsl.ssbo=true
glsl.imageLoadStore=true
versionHoisting=std430,iimage,uimage,imageLoad,imageStore,uint,uvec2,uvec3,uvec4,flat
shadowBounds.instrumentation=false
shadowBounds.binding=-1
files.in=in.vertex.glsl,in.fragment.glsl
engine=douira
outcome=ok
source=hand-written
