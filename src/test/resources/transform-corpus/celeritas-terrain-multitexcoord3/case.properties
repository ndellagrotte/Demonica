# Hand-written mini-corpus case (docs/glsl-transformer_adoption/ADOPTION_PLAN.md, Step 6): a Celeritas terrain vertex shader that declares gl_MultiTexCoord3 and not mc_midTexCoord, so patchMultiTexCoord3 renames it and injects a declaration before replaceMidTexCoord replaces mc_midTexCoord (TauMC's stale by-text replaceExpression cache, S3 remark 3). The TauMC engine cannot transform it: replaceMidTexCoord's removeVariable removes the declaration patchMultiTexCoord3 just injected, TauMC's variable anchor, and the next injectVariable throws (found in Step 6)
domain=iris
patch=CELERITAS_TERRAIN
parameters=CeleritasTerrainParameters
textureStage=GBUFFERS_AND_SHADOW
textureMap=null
stages=vertex,fragment
glsl.maxVersion=460
glsl.ssbo=true
glsl.imageLoadStore=true
versionHoisting=std430,iimage,uimage,imageLoad,imageStore,uint,uvec2,uvec3,uvec4,flat
shadowBounds.instrumentation=false
shadowBounds.binding=-1
files.in=in.vertex.glsl,in.fragment.glsl
engine=taumc
outcome=error
error=java.lang.IndexOutOfBoundsException: Index: -1, Size: 30
source=hand-written
