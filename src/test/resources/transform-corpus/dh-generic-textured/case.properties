# Hand-written mini-corpus case (docs/IRIS_PORTING_PLAN.md, item 3.3): a Distant Horizons generic program whose #version 120 fragment stage calls dh_hasTexture() and dh_sampleTexture() as BSL's dh_terrain does under DISTANT_HORIZONS_TEXTURES; Iris (DHGenericTransformer) declares them for DH_GENERIC fragment stages. The reference is out.douira.*, recorded from the glsl-transformer engine before the port
domain=iris
patch=DH_GENERIC
parameters=DHParameters
textureStage=GBUFFERS_AND_SHADOW
textureMap=null
stages=vertex,fragment
glsl.maxVersion=460
glsl.ssbo=true
glsl.imageLoadStore=true
versionHoisting=std430,iimage,uimage,imageLoad,imageStore,uint,uvec2,uvec3,uvec4,flat
shadowBounds.instrumentation=false
shadowBounds.binding=-1
files.in=in.vertex.glsl,in.fragment.glsl
engine=douira
outcome=ok
source=hand-written
