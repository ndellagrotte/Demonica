# Hand-written mini-corpus case (docs/IRIS_PORTING_PLAN.md, item 0.1): a Celeritas terrain program gated on IRIS_FEATURE_FADE_VARIABLE (preprocessed in, as Complementary Reimagined r5.9.3's gbuffers_terrain is): the vertex stage passes mc_chunkFade to the fragment stage. Iris 1.11.4's SodiumTransformer declares mc_chunkFade in the vertex stage (1.0 for a chunk with no fade-in time, -1.0 in shadow); the reference is out.douira.*, recorded from the glsl-transformer engine before that port (the vertex stage read an undeclared mc_chunkFade then)
domain=iris
patch=CELERITAS_TERRAIN
parameters=CeleritasTerrainParameters
textureStage=GBUFFERS_AND_SHADOW
textureMap=null
stages=vertex,fragment
glsl.maxVersion=460
glsl.ssbo=true
glsl.imageLoadStore=true
versionHoisting=std430,iimage,uimage,imageLoad,imageStore,uint,uvec2,uvec3,uvec4,flat
shadowBounds.instrumentation=false
shadowBounds.binding=-1
files.in=in.vertex.glsl,in.fragment.glsl
engine=douira
outcome=ok
source=hand-written
