# Hand-written mini-corpus case (docs/IRIS_PORTING_PLAN.md, item 3.3): a Distant Horizons terrain program with a geometry stage that does not pass DH's block position or tile id on, and a fragment stage that calls dh_hasTexture() and dh_sampleTexture(); Iris's transformGrouped declares the fragment stage's iris_vBlockPos and iris_TexId as geometry outputs and zeroes them, so the LOD keeps its flat colour. The reference is out.douira.*, recorded from the glsl-transformer engine before the port
domain=iris
patch=DH_TERRAIN
parameters=DHParameters
textureStage=GBUFFERS_AND_SHADOW
textureMap=null
stages=vertex,geometry,fragment
glsl.maxVersion=460
glsl.ssbo=true
glsl.imageLoadStore=true
versionHoisting=std430,iimage,uimage,imageLoad,imageStore,uint,uvec2,uvec3,uvec4,flat
shadowBounds.instrumentation=false
shadowBounds.binding=-1
files.in=in.vertex.glsl,in.geometry.glsl,in.fragment.glsl
engine=douira
outcome=ok
source=hand-written
