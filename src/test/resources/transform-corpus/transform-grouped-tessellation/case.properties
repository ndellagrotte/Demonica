# Hand-written mini-corpus case (docs/glsl-transformer_adoption/ADOPTION_PLAN.md, Step 12): tessellation stages between vertex and fragment: the tessellation control stage reads vNormal, which the vertex stage does not write. The reference is out.douira.*: TauMC was gone, so it was recorded from the glsl-transformer engine before the Step 12 port of Iris 26.1's CompatibilityTransformer
domain=iris
patch=COMPOSITE
parameters=TextureStageParameters
textureStage=COMPOSITE_AND_FINAL
textureMap=0
stages=vertex,tess_control,tess_eval,fragment
glsl.maxVersion=460
glsl.ssbo=true
glsl.imageLoadStore=true
versionHoisting=std430,iimage,uimage,imageLoad,imageStore,uint,uvec2,uvec3,uvec4,flat
shadowBounds.instrumentation=false
shadowBounds.binding=-1
files.in=in.vertex.glsl,in.tess_control.glsl,in.tess_eval.glsl,in.fragment.glsl
engine=douira
outcome=ok
source=hand-written
