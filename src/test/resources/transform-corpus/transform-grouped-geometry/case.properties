# Hand-written mini-corpus case (docs/glsl-transformer_adoption/ADOPTION_PLAN.md, Step 12): a geometry stage between vertex and fragment: array ins in the geometry stage, one of them (vColor) with no vertex out, and a fragment in (fog) with no geometry out. The reference is out.douira.*: TauMC was gone, so it was recorded from the glsl-transformer engine before the Step 12 port of Iris 26.1's CompatibilityTransformer
domain=iris
patch=COMPOSITE
parameters=TextureStageParameters
textureStage=COMPOSITE_AND_FINAL
textureMap=0
stages=vertex,geometry,fragment
glsl.maxVersion=460
glsl.ssbo=true
glsl.imageLoadStore=true
versionHoisting=std430,iimage,uimage,imageLoad,imageStore,uint,uvec2,uvec3,uvec4,flat
shadowBounds.instrumentation=false
shadowBounds.binding=-1
files.in=in.vertex.glsl,in.geometry.glsl,in.fragment.glsl
engine=douira
outcome=ok
source=hand-written
