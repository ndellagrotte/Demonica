# Hand-written mini-corpus case (docs/IRIS_PORTING_PLAN.md, item 3.2): a #version 120 gbuffers fragment shader that declares texture and gcolor in one declaration (uniform sampler2D gcolor, texture;) and reads both; Iris (CommonTransformer getGtextureRenameTargets) removes the texture member and renames gcolor to gtexture, so one gtexture remains. The reference is out.douira.*, recorded from the glsl-transformer engine before the port
domain=iris
