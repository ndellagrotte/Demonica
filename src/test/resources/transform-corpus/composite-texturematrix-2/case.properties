# Hand-written mini-corpus case (docs/IRIS_PORTING_PLAN.md, item 3.4): a #version 120 composite pass that reads gl_TextureMatrix[0], [1], [2] and [3]; [2] becomes iris_LightmapTextureMatrix like [1] (Iris glTextureMatrix2), [3] keeps the catch-all identity. The reference is out.douira.*, recorded from the glsl-transformer engine before the port
domain=iris
patch=COMPOSITE
parameters=TextureStageParameters
textureStage=COMPOSITE_AND_FINAL
textureMap=0
stages=vertex,fragment
glsl.maxVersion=460
glsl.ssbo=true
glsl.imageLoadStore=true
versionHoisting=std430,iimage,uimage,imageLoad,imageStore,uint,uvec2,uvec3,uvec4,flat
shadowBounds.instrumentation=false
shadowBounds.binding=-1
files.in=in.vertex.glsl,in.fragment.glsl
engine=douira
outcome=ok
source=hand-written
