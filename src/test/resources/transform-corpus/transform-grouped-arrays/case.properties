# Hand-written mini-corpus case (docs/glsl-transformer_adoption/ADOPTION_PLAN.md, Step 12): array varyings: an array type (vec3[2] against vec4[2]) and an array declarator (vec3 w[2] against vec4 w[2]) whose types differ between the stages, and an array declarator the vertex stage never assigns (float lit[2]). The reference is out.douira.*: TauMC was gone, so it was recorded from the glsl-transformer engine before the Step 12 port of Iris 26.1's CompatibilityTransformer
domain=iris
patch=COMPOSITE
parameters=TextureStageParameters
