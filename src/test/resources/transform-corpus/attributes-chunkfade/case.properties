# Hand-written mini-corpus case (docs/IRIS_PORTING_PLAN.md, item 0.1): a gbuffers program gated on IRIS_FEATURE_FADE_VARIABLE (preprocessed in, as BSL 10.1.8's gbuffers_terrain is): the vertex stage passes mc_chunkFade on, the fragment stage reads it too. Iris 1.11.4's VanillaTransformer declares const float mc_chunkFade = -1.0 in every stage; the reference is out.douira.*, recorded from the glsl-transformer engine before that port (both stages read an undeclared mc_chunkFade then)
