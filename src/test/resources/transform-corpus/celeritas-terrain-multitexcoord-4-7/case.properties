# Hand-written mini-corpus case (docs/IRIS_PORTING_PLAN.md, item 3.1): a Celeritas terrain vertex shader that reads gl_MultiTexCoord4 to 7, which become vec4(0.0, 0.0, 0.0, 1.0) as in Iris (SodiumTransformer.replaceGlMultiTexCoordBounded 4-7). The reference is out.douira.*, recorded from the glsl-transformer engine before the port
domain=iris
patch=CELERITAS_TERRAIN
parameters=CeleritasTerrainParameters
textureStage=GBUFFERS_AND_SHADOW
textureMap=null
stages=vertex,fragment
glsl.maxVersion=460
glsl.ssbo=true
glsl.imageLoadStore=true
versionHoisting=std430,iimage,uimage,imageLoad,imageStore,uint,uvec2,uvec3,uvec4,flat
shadowBounds.instrumentation=false
shadowBounds.binding=-1
files.in=in.vertex.glsl,in.fragment.glsl
engine=douira
outcome=ok
source=hand-written
