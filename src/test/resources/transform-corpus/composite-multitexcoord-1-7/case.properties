# Hand-written mini-corpus case (docs/IRIS_PORTING_PLAN.md, item 3.1): a #version 120 composite vertex shader that reads gl_MultiTexCoord0 to 7; 1 to 7 become vec4(0.0, 0.0, 0.0, 1.0) as in Iris (CompositeTransformer.replaceGlMultiTexCoordBounded 1-7), 0 stays the quad's texture coordinate. The reference is out.douira.*, recorded from the glsl-transformer engine before the port
domain=iris
patch=COMPOSITE
parameters=TextureStageParameters
textureStage=COMPOSITE_AND_FINAL
textureMap=0
stages=vertex,fragment
glsl.maxVersion=460
glsl.ssbo=true
glsl.imageLoadStore=true
versionHoisting=std430,iimage,uimage,imageLoad,imageStore,uint,uvec2,uvec3,uvec4,flat
shadowBounds.instrumentation=false
shadowBounds.binding=-1
files.in=in.vertex.glsl,in.fragment.glsl
engine=douira
outcome=ok
source=hand-written
