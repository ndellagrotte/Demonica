# Late/conditional mixin configs and the requirements that gate them.
# Format: <config name>=<requirements>
# Comma-separated requirements form an AND group; '|' separates alternative groups.
# A requirement is a mod id, or class:<binary name> to probe for the class resource
# (for compat layers gated on embedded third-party code rather than a mod container).
# A config loads when ANY group is fully present.
# Kept separate from the mixin json files: the mixin loader does not accept custom fields.
mixins.demonica.gibbed.json=gibbed
mixins.demonica.ichunutil.json=ichunutil
mixins.demonica.lumenized.json=class:gregtech.client.utils.BloomEffectUtil
mixins.demonica.revoui.json=neofontrender_ui_enhancements
mixins.demonica.ccl.json=codechickenlib
mixins.demonica.voxelmap.json=voxelmap
mixins.demonica.extrautils2.json=extrautils2
mixins.demonica.cofhcore.json=cofhcore
mixins.demonica.oldresearch.json=oldresearch
mixins.demonica.botania.json=botania
mixins.demonica.hbm.json=hbm
mixins.demonica.scannable.json=scannable
mixins.demonica.littletiles.json=littletiles
mixins.demonica.obscuretooltips.json=obscure_tooltips
mixins.demonica.distanthorizons.json=distanthorizons
