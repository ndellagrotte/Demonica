/*
 * Demonica: a shader mod for Minecraft 1.12.2 on Cleanroom 0.7 (Java 25, SDL 3), running on the upstream Celeritas
 * mod, which its jar bundles (docs/FORK.md, docs/celeritas/PIN.md).
 *
 * The toolchain is CleanroomGradle and CleanroomMC's Conventions. cleanroom.userdev(cleanroom_version) supplies the
 * MCP-named Minecraft and Cleanroom workspace, with demonica_at.cfg applied; the mods Demonica compiles against are
 * declared through deobf(...), which renames their SRG jars to MCP for the compile and test classpaths only. The dev
 * client runs the other mods' raw SRG jars (devRuntimeMods), which Cleanroom remaps as it loads them, and Celeritas as
 * remapCeleritasForDev's mixin-aware MCP remap, which is also what the compile and test classpaths see: Cleanroom does
 * not rename the injector targets of a mixin without a refmap, as Celeritas's are. Conventions computes the
 * version from git tags (Versioning: `./gradlew -q printVersion`), sets the toolchain, JUnit and the reproducible jars,
 * and fills mcmod.info's @{TOKEN}s (Token Envoy, tokens.properties).
 *
 * Celeritas is pinned in gradle.properties: the upstream commit (celeritas_sha), the Maven build the mod compiles
 * against (celeritas_version), the Celeritas-auto-build GitHub release and asset the mod jar carries
 * (celeritas_release, celeritas_release_asset, celeritas_asset_sha256), and the SHA-256 of every accepted jar
 * (celeritas_sha256). The asset is nested unmodified at the jar's root as
 * zz-demonica-bundled-celeritas-<sha8>-<timestamp>.jar and listed in ContainedDeps, so Cleanroom extracts it to
 * mods/1.12.2; BundledCeleritasHook, named by the manifest's Bansoukou attribute, then uses the bundled copy unless the
 * player installed a Celeritas, which takes precedence. verifyBundledCeleritasPin checks the asset, and
 * celeritasPinCandidate prints the values for another auto-build.
 *
 * The root project holds the mod: com.demonica.* and Actinium's com.gtnewhorizons.angelica.* glue, derived from
 * actinium@4a19c959. :shader (the Iris tree) and :glsm are merged into its jar, and so is GTNHLib, from the latest
 * release of S8TNLib (docs/FORK.md; not pinned: the jar's manifest records the version and commit that went in). `jar`
 * writes the MCP-named jar to build/devlibs; the distributed jar is `reobfJar`'s SRG rename of it in build/libs, which
 * verifyDistributedJar checks.
 *
 * :diagnostics is the companion jar, Demonica-diagnostics-<version>.jar (its own reobfJar, written to this project's
 * build/libs): the GL debug logs, the flight recorder and the dev harness, which the mod jar reaches only through no-op
 * facades. Dev runs (runClient) load it unless -PwithoutDiagnostics; verifyDiagnosticsJar checks it.
 */
import net.fabricmc.tinyremapper.IMappingProvider
import net.fabricmc.tinyremapper.OutputConsumerPath
import net.fabricmc.tinyremapper.TinyRemapper
import net.fabricmc.tinyremapper.extension.mixin.MixinExtension
import org.objectweb.asm.ClassReader
import org.objectweb.asm.ClassWriter
import org.objectweb.asm.Type
import org.objectweb.asm.tree.AnnotationNode
import org.objectweb.asm.tree.ClassNode

// The build script's own libraries (the settings plugin adds repositories for the projects' dependencies only):
// tiny-remapper, whose Mixin extension renames a mixin's annotation targets with its members, for the dev client's
// Celeritas (remapCeleritasForDev); and its ASM, which the jar checks read classes with (verifyMixinReobf).
buildscript {
    repositories {
        exclusiveContent {
            forRepository {
                maven {
                    name = 'FabricMC'
                    url = 'https://maven.fabricmc.net'
                }
            }
            filter {
                includeGroup('net.fabricmc')
            }
        }
        mavenCentral()
    }
    dependencies {
        classpath 'net.fabricmc:tiny-remapper:0.14.1'
    }
}

plugins {
    id 'java'
    id 'com.cleanroommc.cleanroomgradle'
    id 'com.cleanroommc.conventions' version '1.4.1'
}

group = root_package

base {
    archivesName = 'Demonica'
}

conventions {
    author = mod_authors
    repositoryUrl = mod_url
}

configurations {
    // Libraries shipped as nested jars (ContainedDeps) inside the mod jar.
    contain
    implementation.extendsFrom(contain)
    // Mods compiled against, as MCP-named jars: deobf(...) copies, Celeritas's dev remap (remapCeleritasForDev) and
    // CodeChickenLib's -dev jar.
    modCompileOnly
    compileOnly.extendsFrom(modCompileOnly)
    // The mod jars the dev client loads through -Dcrl.dev.extrapath: the raw (SRG-named) jars of the optional mods,
    // which Cleanroom remaps as it loads them, and Celeritas's dev remap (remapCeleritasForDev). It extends nothing and
    // nothing extends it: the optional mods stay off the compile and test classpaths, and CeleritasJar wants exactly
    // one Celeritas there.
    devRuntimeMods {
        canBeConsumed = false
        canBeResolved = true
        attributes {
            attribute(Usage.USAGE_ATTRIBUTE, objects.named(Usage, Usage.JAVA_RUNTIME))
            attribute(Category.CATEGORY_ATTRIBUTE, objects.named(Category, Category.LIBRARY))
            attribute(LibraryElements.LIBRARY_ELEMENTS_ATTRIBUTE, objects.named(LibraryElements, LibraryElements.JAR))
        }
    }
    // S8TNLib's sources jar, which sourcesJar merges. Nothing compiles against it.
    s8tnlibSources {
        transitive = false
    }
    // The Celeritas release asset the jar nests unmodified (bundledCeleritasCoordinate). It extends nothing and nothing
    // extends it: the asset is SRG-named and must stay off the compile and runtime classpaths, which get the Maven
    // jar's dev remap (remapCeleritasForDev) instead. (contain, which extends implementation, is for libraries only.)
    bundledCeleritas {
        transitive = false
        canBeConsumed = false
    }
}

def embeddedLibraryProjects = [
    project(':glsm'),
    project(':shader')
]

def mergedEmbeddedLibraryClassesDir = layout.buildDirectory.dir('embedded-library-classes/main')

ext.sharedMinecraftCompileClasspath = {
    rootProject.files(rootProject.provider {
        // Not the jars the mod's compat builds for itself (build/compat): the subprojects never use them.
        def compatJars = rootProject.layout.buildDirectory.dir('compat').get().asFile.toPath()
        rootProject.tasks.named('compileJava', JavaCompile).get().classpath.files.findAll {
            it.isFile() && !it.toPath().startsWith(compatJars)
        }
    }).builtBy(rootProject.tasks.named('remapCeleritasForDev'))
}

/*
 * reobfJar renames the jar with mcp2srg.tsrg, which knows Minecraft's classes but not the mixins: a mixin's @Shadow and
 * @Overwrite members (and the calls to them) are declared on the mixin class, under the target's MCP names, and would
 * keep them, so that in production (SRG names) a shadow is not found in its target and an @Overwrite adds a method
 * instead of replacing one. Unimined's remap renamed them (mixinRemap); here the Mixin annotation processor writes the
 * SRG name of each such member to build/mixin/mixin-out.tsrg (-AoutTsrgFile), mergeReobfMappings appends that to
 * mcp2srg.tsrg, and reobfJar renames with the result. verifyMixinReobf checks the jars. For the root project and
 * :diagnostics, which have their own reobfJar.
 */
ext.useMixinReobfMappings = { Project target ->
    def mixinMappings = target.layout.buildDirectory.file('mixin/mixin-out.tsrg')
    def mergedMappings = target.layout.buildDirectory.file('mixin/mcp2srg-with-mixins.tsrg')
    def compileJava = target.tasks.named('compileJava', JavaCompile)
    compileJava.configure {
        def file = mixinMappings.get().asFile
        outputs.file(file).withPropertyName('mixinMappings')
        options.compilerArgs.add("-AoutTsrgFile=${file.absolutePath}".toString())
        doFirst {
            file.parentFile.mkdirs()
        }
    }
    def merge = target.tasks.register('mergeReobfMappings') {
        group = 'build'
        description = "Writes reobfJar's map: mcp2srg.tsrg and the SRG names of the mixins' @Shadow/@Overwrite members."
        def base = target.tasks.named('extractUserdevMcpToSrg').flatMap { it.output }
        dependsOn compileJava
        inputs.file(base).withPropertyName('mcpToSrg')
        inputs.files(mixinMappings).withPropertyName('mixinMappings')
        outputs.file(mergedMappings)
        doLast {
            def mixins = mixinMappings.get().asFile
            // Both are headerless TSRG v1; the processor's file holds only the mixin classes' own blocks.
            mergedMappings.get().asFile.text = base.get().asFile.getText('UTF-8').trim() + '\n' +
                (mixins.isFile() ? mixins.getText('UTF-8') : '')
        }
    }
    target.tasks.named('reobfJar').configure {
        dependsOn merge
        map.setFrom(mergedMappings)
    }
}

// S8TNLib's jar in MCP names: the deobf'd release jar (modCompileOnly below, s8tnlib-<version>-deobf.jar), which is
// what the compile classpath resolves to, so it merges like the subprojects' outputs and reobfJar maps it to SRG with
// the rest.
def s8tnlibJar = configurations.compileClasspath.filter {
    it.name ==~ /s8tnlib-.*\.jar/ && !it.name.endsWith('-sources.jar')
}

// What Demonica takes from S8TNLib's jars: GTNHLib, without the parts that make S8TNLib a mod of its own (its @Mod and
// coremod, mcmod.info and manifest), that would clash with Demonica's own license files, or that the deobf rename
// adds (the renamer's parameter-name list for abstract methods).
def s8tnlibExcludes = ['META-INF/**', 'com/s8tnlib/**', 'mcmod.info', 'LICENSE', 'THIRD_PARTY_NOTICES.md',
                       'fernflower_abstract_parameter_names.txt']

// The subprojects' classes and resources, and S8TNLib's GTNHLib classes, become part of the mod's own output, so the
// jar and the dev runs see one mod, as in production.
def mergeEmbeddedLibraryClasses = tasks.register('mergeEmbeddedLibraryClasses', Sync) {
    duplicatesStrategy = DuplicatesStrategy.FAIL
    dependsOn embeddedLibraryProjects.collect { it.tasks.named('classes') }
    into mergedEmbeddedLibraryClassesDir

    embeddedLibraryProjects.each { libraryProject ->
        from(libraryProject.sourceSets.main.output)
    }
    from({ s8tnlibJar.collect { zipTree(it) } }) {
        exclude s8tnlibExcludes
    }
}

sourceSets.main.output.dir(mergedEmbeddedLibraryClassesDir, builtBy: mergeEmbeddedLibraryClasses)

/*
 * SRG-to-MCP names from a TSRG v1 file such as CleanroomGradle's srg2mcp.tsrg: class lines ("srg mcp"), then a tab
 * before each field ("srg mcp") and method ("srg desc mcp") of that class. In 1.12.2 the class names are the same in both
 * and every func_/field_ name is unique, so `names` (SRG member name to MCP name) needs no owner.
 */
def readSrgToMcp = { File tsrg ->
    def classes = [:]
    def fields = []
    def methods = []
    def names = [:]
    String owner = null
    tsrg.eachLine('UTF-8') { String line ->
        if (line.isBlank() || line.startsWith('#')) {
            return
        }
        def parts = line.trim().split(' ')
        if (!line.startsWith('\t')) {
            owner = parts[0]
            classes[parts[0]] = parts[1]
        } else if (parts.length == 2) {
            fields << [owner, parts[0], parts[1]]
            names[parts[0]] = parts[1]
        } else if (parts.length == 3) {
            methods << [owner, parts[0], parts[1], parts[2]]
            names[parts[0]] = parts[2]
        } else {
            throw new GradleException("${tsrg}: not a TSRG v1 line: ${line}")
        }
    }
    [classes: classes, fields: fields, methods: methods, names: names]
}

/*
 * Renames an SRG-named mod jar to MCP names for the dev client, the way Unimined's mixin-aware remap did: tiny-remapper
 * renames the classes' member references and, through its Mixin extension, the mixins' @Shadow/@Overwrite members and
 * the target strings of their injectors (@Inject's method, @At's target) in place. CleanroomGradle's deobf() renames
 * none of the annotations, and Cleanroom does not rename an injector's target in a mixin without a refmap, so the dev
 * client cannot run a raw or deobf'd Celeritas (docs/celeritas/PIN.md, "In Demonica's build"). The access transformer's
 * func_/field_ names are renamed too. The jar is rebuilt in the input's entry order with the input's entry times, and
 * resources other than the AT are copied byte for byte, so the same input always gives the same bytes (dev_sha256).
 */
def remapSrgModJarToMcp = { File input, File srgToMcp, Collection<File> libraries, File output ->
    def mappings = readSrgToMcp(srgToMcp)
    IMappingProvider provider = { IMappingProvider.MappingAcceptor acceptor ->
        mappings.classes.each { String srg, String mcp ->
            if (srg != mcp) {
                acceptor.acceptClass(srg, mcp)
            }
        }
        mappings.fields.each { acceptor.acceptField(new IMappingProvider.Member(it[0], it[1], null), it[2]) }
        mappings.methods.each { acceptor.acceptMethod(new IMappingProvider.Member(it[0], it[1], it[2]), it[3]) }
    } as IMappingProvider
    def remapper = TinyRemapper.newRemapper()
        .withMappings(provider)
        .ignoreFieldDesc(true)
        .skipLocalVariableMapping(true)
        .rebuildSourceFilenames(false)
        .extension(new MixinExtension())
        .build()
    def remapped = new java.util.concurrent.ConcurrentHashMap<String, byte[]>()
    try {
        remapper.readClassPath(libraries.findAll { it.exists() }*.toPath() as java.nio.file.Path[])
        remapper.readInputs(input.toPath())
        remapper.apply({ String name, byte[] bytes -> remapped.put(name, bytes) } as java.util.function.BiConsumer)
    } finally {
        remapper.finish()
    }
    // tiny-remapper renames a member reference, and an injector's target, through the owner's hierarchy as the SRG-named
    // Minecraft jar declares it. Forge's classes are not in that jar, so a reference it cannot follow keeps its SRG name
    // (CeleritasVintage's ClientCommandHandler.func_71560_a, inherited from CommandHandler; MixinGuiIngameForge's
    // target GuiIngameForge.func_175180_a, an override of GuiIngame's). Every func_/field_ name is unique, so what is
    // left in the bytecode and in a mixin's annotation strings is renamed by name alone. A name srg2mcp.tsrg does not
    // have stays as it is (RenderItemMixin's func_175032_a, as in Unimined's remap).
    def srgToken = ~/\b(?:func|field)_[0-9]+_[A-Za-z0-9_]+/
    def renameStrings
    renameStrings = { Object value ->
        if (value instanceof String) {
            return value.replaceAll(srgToken) { String name -> mappings.names[name] ?: name }
        }
        if (value instanceof AnnotationNode) {
            if (value.values != null) {
                for (int i = 1; i < value.values.size(); i += 2) {
                    value.values[i] = renameStrings(value.values[i])
                }
            }
            return value
        }
        if (value instanceof List) {
            return value.collect { renameStrings(it) }
        }
        return value
    }
    def byName = new org.objectweb.asm.commons.Remapper() {
        @Override
        String mapMethodName(String owner, String name, String descriptor) {
            name.startsWith('func_') ? (mappings.names[name] ?: name) : name
        }

        @Override
        String mapFieldName(String owner, String name, String descriptor) {
            name.startsWith('field_') ? (mappings.names[name] ?: name) : name
        }
    }
    def renameLeftoverSrgNames = { byte[] bytes ->
        def node = new ClassNode()
        new ClassReader(bytes).accept(new org.objectweb.asm.commons.ClassRemapper(node, byName), 0)
        if ((node.invisibleAnnotations ?: []).any { it.desc == 'Lorg/spongepowered/asm/mixin/Mixin;' }) {
            def annotated = [node] + node.fields + node.methods
            annotated.each { member ->
                [member.invisibleAnnotations, member.visibleAnnotations].each { it?.each(renameStrings) }
            }
        }
        def writer = new ClassWriter(0)
        node.accept(writer)
        return writer.toByteArray()
    }
    // tiny-remapper skips module descriptors (the shaded JOML's); they name no Minecraft member and are copied as is.
    output.parentFile.mkdirs()
    new java.util.zip.ZipFile(input).withCloseable { zip ->
        new java.util.zip.ZipOutputStream(new FileOutputStream(output)).withCloseable { out ->
            zip.entries().each { java.util.zip.ZipEntry entry ->
                def bytes
                if (entry.directory) {
                    bytes = new byte[0]
                } else if (entry.name.endsWith('.class') && !entry.name.endsWith('module-info.class')) {
                    bytes = remapped.remove(entry.name.substring(0, entry.name.length() - '.class'.length()))
                    if (bytes == null) {
                        throw new GradleException("tiny-remapper wrote no ${entry.name} for ${input.name}")
                    }
                    bytes = renameLeftoverSrgNames(bytes)
                } else if (entry.name ==~ /META-INF\/[^\/]*_at\.cfg/) {
                    bytes = zip.getInputStream(entry).withCloseable { it.getText('UTF-8') }
                        .replaceAll(srgToken) { String name -> mappings.names[name] ?: name }.getBytes('UTF-8')
                } else {
                    bytes = zip.getInputStream(entry).withCloseable { it.bytes }
                }
                def copy = new java.util.zip.ZipEntry(entry.name)
                copy.timeLocal = entry.timeLocal
                out.putNextEntry(copy)
                out.write(bytes)
                out.closeEntry()
            }
        }
    }
    if (!remapped.isEmpty()) {
        throw new GradleException("tiny-remapper wrote classes that ${input.name} does not have: ${remapped.keySet()}")
    }
}

def celeritasCoordinate = "org.embeddedt:celeritas-forge-mc12.2:${property('celeritas_version')}"

/*
 * The pinned Celeritas Maven jar (verifyCeleritasPin) renamed to MCP names, mixins included (remapSrgModJarToMcp): the
 * jar the dev client runs (devRuntimeMods) and the one the compile and test classpaths see (modCompileOnly), so the tests
 * read the same MCP names Demonica's own mixins use. Its SHA-256 is the pin's dev_sha256.
 */
def rawCeleritasJar = configurations.detachedConfiguration(dependencies.create(celeritasCoordinate)).tap {
    transitive = false
}
def remapCeleritasForDev = tasks.register('remapCeleritasForDev') {
    group = 'build'
    description = 'Renames the pinned Celeritas jar, its mixins included, to MCP names for the dev client and the tests.'
    def input = rawCeleritasJar
    def srgToMcp = tasks.named('extractUserdevSrgToMcp').flatMap { it.output }
    // The SRG-named Minecraft and its libraries, which CleanroomGradle's deobf() resolves inherited members against.
    def libraries = project.extensions.getByType(com.cleanroommc.gradle.api.ext.DeobfExtension).srgLibraries
    def output = layout.buildDirectory.file("celeritas-dev/celeritas-forge-mc12.2-${project.property('celeritas_version')}-dev.jar")
    inputs.files(input).withPropertyName('celeritas')
    inputs.file(srgToMcp).withPropertyName('srgToMcp')
    inputs.files(libraries).withPropertyName('srgLibraries').withNormalizer(ClasspathNormalizer)
    outputs.file(output)
    doLast {
        remapSrgModJarToMcp(input.singleFile, srgToMcp.get().asFile, libraries.files, output.get().asFile)
    }
}
def celeritasDevJar = files(remapCeleritasForDev)

/*
 * META-INF/demonica/celeritas-pin: the Celeritas build this Demonica was made for. QuarantineGuard compares the
 * installed jar's SHA-256 with it at startup (docs/celeritas/LEDGER.md, "The guard"). dev_sha256 is the hash of
 * remapCeleritasForDev's mixin-aware MCP remap of the pinned Maven jar, which the dev client runs and the compile
 * classpath and the tests read; the guard trusts it only in a deobfuscated environment, and the jar task drops it. The
 * Maven jar the remap starts from must itself be one of the pinned jars.
 */
def generatedPinDir = layout.buildDirectory.dir('generated/celeritas-pin')
def generateCeleritasPin = tasks.register('generateCeleritasPin') {
    description = 'Writes the Celeritas pin QuarantineGuard checks the installed jar against.'
    def devJar = celeritasDevJar
    def mavenJar = rawCeleritasJar
    def outputFile = generatedPinDir.map { it.file('META-INF/demonica/celeritas-pin') }
    def pins = project.property('celeritas_sha256').toString()
    def upstreamCommit = project.property('celeritas_sha').toString()
    def celeritasVersion = project.property('celeritas_version').toString()

    inputs.files(devJar).withPropertyName('devJar')
    inputs.files(mavenJar).withPropertyName('mavenJar')
    inputs.property('pins', pins)
    inputs.property('upstreamCommit', upstreamCommit)
    inputs.property('celeritasVersion', celeritasVersion)
    outputs.dir(generatedPinDir)

    doLast {
        def sha256 = { File jar -> java.security.MessageDigest.getInstance('SHA-256').digest(jar.bytes).encodeHex().toString() }
        def devSha256 = sha256(devJar.singleFile)
        def mavenSha256 = sha256(mavenJar.singleFile)
        def pinned = pins.split(',')*.trim()*.toLowerCase()
        if (!(mavenSha256 in pinned)) {
            throw new GradleException("The Celeritas jar the dev remap starts from (${mavenJar.singleFile}, SHA-256 " +
                "${mavenSha256}) is not one of celeritas_sha256 (${pinned.join(', ')}).")
        }
        def file = outputFile.get().asFile
        delete(generatedPinDir)
        file.parentFile.mkdirs()
        file.text = """\
            |# The Celeritas build this Demonica was made for (docs/celeritas/PIN.md). Written by generateCeleritasPin.
            |celeritas_sha=${upstreamCommit}
            |celeritas_version=${celeritasVersion}
            |celeritas_sha256=${pins.split(',')*.trim().join(',')}
            |dev_sha256=${devSha256}
            |""".stripMargin()
    }
}

sourceSets.main.output.dir(generatedPinDir, builtBy: generateCeleritasPin)

def lombokVersion = '1.18.46'

subprojects {
    apply plugin: 'java-library'
    group = rootProject.group
    // Versioning computes the root project's version from git; the subprojects take the same string. None of them
    // applies Versioning itself (it refuses a project whose version is already set).
    version = rootProject.versioning.version.get()

    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(25)
        }
    }

    dependencies {
        // :glsm and :shader compile against the root project's classpath: the userdev workspace, the deobf'd mods,
        // S8TNLib and the annotation libraries. :diagnostics declares its own (diagnostics/build.gradle).
        if (project.name != 'diagnostics') {
            compileOnly rootProject.ext.sharedMinecraftCompileClasspath()
        }
        annotationProcessor "org.projectlombok:lombok:${lombokVersion}"
    }

    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
    }

    tasks.withType(Javadoc).configureEach {
        failOnError = false
    }
}

def s8tnlibDir = project.findProperty('s8tnlibDir')
def s8tnlibLatestRelease = 'https://api.github.com/repos/ndellagrotte/S8TNLib/releases/latest'
def s8tnlibLatestPage = 'https://github.com/ndellagrotte/S8TNLib/releases/latest'

/*
 * S8TNLib's version: its latest published GitHub release (drafts and prereleases are not "latest"), asked of GitHub's
 * API while the build is configured. GITHUB_TOKEN, when set (CI), authenticates the call. When the API refuses it (the
 * anonymous rate limit, as in the release workflow), the version comes from the tag that the releases/latest page
 * redirects to, which needs no token. The answer is cached in .gradle/demonica/s8tnlib-latest, which --offline builds
 * and builds that cannot reach GitHub fall back to. With
 * -Ps8tnlibDir=<dir>, the version is that of the s8tnlib-<version>.jar in the directory, or -Ps8tnlibVersion=<version>
 * when it holds several.
 */
def resolveS8tnlibVersion = {
    if (s8tnlibDir != null) {
        def versions = (file(s8tnlibDir).listFiles() ?: []).findAll { !it.name.endsWith('-sources.jar') }
            .collect { (it.name =~ /^s8tnlib-(.+)\.jar$/).with { it.matches() ? it.group(1) : null } }
            .findAll().sort()
        def chosen = project.findProperty('s8tnlibVersion')?.toString()
        if (chosen != null ? !versions.contains(chosen) : versions.size() != 1) {
            throw new GradleException("-Ps8tnlibDir=${s8tnlibDir} has s8tnlib-<version>.jar for ${versions ?: 'no version'}" +
                (chosen != null ? ", not ${chosen}." : "; pass -Ps8tnlibVersion=<version> to choose one."))
        }
        def version = chosen ?: versions[0]
        logger.lifecycle("S8TNLib: ${version} from ${s8tnlibDir}")
        return version
    }
    def cache = file("${rootDir}/.gradle/demonica/s8tnlib-latest")
    def fromCache = { String reason ->
        def cached = cache.isFile() ? cache.text.trim() : ''
        if (cached.isEmpty()) {
            throw new GradleException("Cannot find S8TNLib's latest release (${reason}), and no earlier answer is " +
                "cached in ${cache}. Build once with access to ${s8tnlibLatestRelease}, or pass -Ps8tnlibDir=<dir>.")
        }
        logger.warn("S8TNLib: latest release v${cached}, from the cache (${reason})")
        return cached
    }
    if (gradle.startParameter.offline) {
        return fromCache('--offline')
    }
    try {
        def connection = (HttpURLConnection) URI.create(s8tnlibLatestRelease).toURL().openConnection()
        connection.connectTimeout = 10_000
        connection.readTimeout = 10_000
        connection.setRequestProperty('Accept', 'application/vnd.github+json')
        connection.setRequestProperty('User-Agent', 'Demonica-build')
        def token = System.getenv('GITHUB_TOKEN')
        if (token) {
            connection.setRequestProperty('Authorization', "Bearer ${token}")
        }
        def tag
        def source = ''
        if (connection.responseCode == HttpURLConnection.HTTP_OK) {
            tag = connection.inputStream.withCloseable { new groovy.json.JsonSlurper().parse(it).tag_name }?.toString()
        } else {
            def refused = "${s8tnlibLatestRelease} answered HTTP ${connection.responseCode}"
            def page = (HttpURLConnection) URI.create(s8tnlibLatestPage).toURL().openConnection()
            page.instanceFollowRedirects = false
            page.connectTimeout = 10_000
            page.readTimeout = 10_000
            page.setRequestProperty('User-Agent', 'Demonica-build')
            // With no release, the page redirects to /releases instead.
            def location = page.responseCode in 300..399 ? page.getHeaderField('Location') : null
            def tagMatch = location ? location =~ /\/releases\/tag\/([^\/?#]+)$/ : null
            tag = tagMatch?.find() ? URLDecoder.decode(tagMatch.group(1), 'UTF-8') : null
            if (tag == null) {
                return fromCache("${refused}, and ${s8tnlibLatestPage} answered HTTP ${page.responseCode}" +
                    (location ? " to ${location}" : ''))
            }
            source = " (from ${s8tnlibLatestPage}; ${refused})"
        }
        def version = tag?.replaceFirst(/^v/, '')
        if (!(version ==~ /[0-9][0-9A-Za-z.+-]*/)) {
            throw new GradleException("S8TNLib's latest release has the tag ${tag}, which is not v<version>.")
        }
        cache.parentFile.mkdirs()
        cache.text = "${version}\n"
        logger.lifecycle("S8TNLib: latest release v${version}${source}")
        return version
    } catch (IOException e) {
        return fromCache(e.toString())
    }
}
ext.s8tnlibVersion = resolveS8tnlibVersion()

/*
 * The Celeritas the mod jar bundles: the asset celeritas_release_asset of the Celeritas-auto-build GitHub release
 * celeritas_release, whose tag names the upstream commit and the build time. The pin is six properties that must agree
 * with each other, so a half-moved pin fails here, while the build is configured, rather than as a jar that bundles one
 * build and checks for another.
 */
def pinnedCeleritasSha = property('celeritas_sha').toString().trim()
def pinnedCeleritasVersion = property('celeritas_version').toString().trim()
def celeritasRelease = property('celeritas_release').toString().trim()
def celeritasReleaseAsset = property('celeritas_release_asset').toString().trim()
def celeritasAssetSha256 = property('celeritas_asset_sha256').toString().trim().toLowerCase()
def celeritasReleaseParts = (celeritasRelease =~ /^commit-([0-9a-f]{40})-([0-9]{8}T[0-9]{6})$/).with {
    it.matches() ? [it.group(1), it.group(2)] : null
}
def celeritasPinProblems = []
if (celeritasReleaseParts == null) {
    celeritasPinProblems << "celeritas_release = ${celeritasRelease} is not commit-<40-digit commit>-<yyyyMMddTHHmmss>, " +
        "the tag Celeritas-auto-build gives its releases"
} else if (celeritasReleaseParts[0] != pinnedCeleritasSha) {
    celeritasPinProblems << "celeritas_release = ${celeritasRelease} is a build of ${celeritasReleaseParts[0]}, not of " +
        "celeritas_sha = ${pinnedCeleritasSha}"
}
if (!pinnedCeleritasVersion.endsWith(".${pinnedCeleritasSha.take(8)}")) {
    celeritasPinProblems << "celeritas_version = ${pinnedCeleritasVersion} does not end in " +
        ".${pinnedCeleritasSha.take(8)}, the commit of celeritas_sha"
}
if (!(celeritasReleaseAsset ==~ /[^\/]+\.jar/)) {
    celeritasPinProblems << "celeritas_release_asset = ${celeritasReleaseAsset} is not the file name of a jar"
}
if (!(celeritasAssetSha256 in (property('celeritas_sha256').toString().split(',')*.trim()*.toLowerCase()))) {
    celeritasPinProblems << "celeritas_asset_sha256 = ${celeritasAssetSha256} is not one of celeritas_sha256, the " +
        "hashes QuarantineGuard accepts"
}
// Gradle configures the whole project before it runs any task, so a throw here would also stop celeritasPinCandidate,
// the helper that prints the lines for a new pin, halfway through moving it. When only that helper or Gradle's help
// tasks are requested, the problems are a warning instead; anything that could package the jar still fails.
def celeritasPinHelperTasks = ['celeritasPinCandidate', 'help', 'tasks', 'properties']
def onlyCeleritasPinHelpers = !gradle.startParameter.taskNames.isEmpty() &&
    gradle.startParameter.taskNames.every { task -> celeritasPinHelperTasks.any { task == it || task.endsWith(":${it}") } }
if (!celeritasPinProblems.isEmpty()) {
    def message = "The Celeritas pin is inconsistent (gradle.properties; docs/celeritas/PIN.md, \"Moving the pin\"):" +
        "\n - ${celeritasPinProblems.join('\n - ')}"
    if (onlyCeleritasPinHelpers) {
        logger.warn(message)
    } else {
        throw new GradleException(message)
    }
}
// The asset's name inside the mod jar, and so in mods/1.12.2 once Cleanroom extracts it. It must start with
// BundledCeleritasHook.BUNDLED_PREFIX, which is how the hook tells its own copies from an installed Celeritas. It names
// the pin because Cleanroom never extracts over a file that exists: a fixed name would keep the first pin a player ever
// had. The zz- makes it sort after the jars a player installs (01-celeritas-..., celeritas-..., demonica-...), since
// Cleanroom's candidates are sorted by lower-cased file name: an installed Celeritas takes precedence over the bundled
// copy, and when Demonica's hook did not run, the installed jar's classes win whenever it also sorts before Demonica's
// own jar (docs/celeritas/PIN.md, "Bundled copy").
// celeritasReleaseParts is null only when the check above merely warned, and then nothing packages the name.
def bundledCeleritasTimestamp = celeritasReleaseParts?.getAt(1) ?: 'invalid'
def bundledCeleritasJarName =
    "zz-demonica-bundled-celeritas-${pinnedCeleritasSha.take(8)}-${bundledCeleritasTimestamp}.jar".toString()
// The release as an ivy module: the asset's name without .jar is the module, the release tag the revision.
def celeritasAssetModule = celeritasReleaseAsset.replaceFirst(/\.jar$/, '')
def bundledCeleritasCoordinate = "io.github.kappa-maintainer:${celeritasAssetModule}:${celeritasRelease}@jar".toString()
// -PceleritasAssetDir=<dir>: take the asset from a local directory instead of GitHub (a pruned release, or no network),
// as -Ps8tnlibDir does for S8TNLib. The file there must still have the pinned name and hash.
def celeritasAssetDir = project.findProperty('celeritasAssetDir')

// Maven Central, Cleanroom's Maven (the only source of com.cleanroommc, top.outlands, zone.rong, net.minecraftforge and
// de.oceanlabs.mcp) and Mojang's libraries come from the CleanroomGradle settings plugin (settings.gradle), ahead of
// these.
repositories {
    // Celeritas's 1.12.2 mod, built from upstream commits by kappa-maintainer/Celeritas-auto-build
    // (docs/celeritas/PIN.md). Nothing else resolves from this repository.
    exclusiveContent {
        forRepository {
            maven {
                name = 'CeleritasAutoBuild'
                url = 'https://maven.outlands.top/releases'
            }
        }
        filter {
            includeModule('org.embeddedt', 'celeritas-forge-mc12.2')
        }
    }
    // S8TNLib's jar and sources jar, from the assets of its GitHub release v<version> (docs/FORK.md). -Ps8tnlibDir=<dir>
    // takes them from a local directory instead, such as S8TNLib's build/libs, to test a build that has no release yet.
    exclusiveContent {
        forRepository {
            ivy {
                if (s8tnlibDir != null) {
                    name = 'S8TNLibLocal'
                    url = file(s8tnlibDir)
                    patternLayout { artifact '[artifact]-[revision](-[classifier]).[ext]' }
                } else {
                    name = 'S8TNLibReleases'
                    url = 'https://github.com/ndellagrotte/S8TNLib/releases/download'
                    patternLayout { artifact 'v[revision]/[artifact]-[revision](-[classifier]).[ext]' }
                }
                metadataSources { artifact() }
            }
        }
        filter {
            includeGroup('com.s8tnlib')
        }
    }
    // The Celeritas the mod jar bundles: the asset of a Celeritas-auto-build GitHub release, at
    // releases/download/<celeritas_release>/<celeritas_release_asset> (bundledCeleritasCoordinate).
    // -PceleritasAssetDir=<dir> takes it from a local directory instead.
    exclusiveContent {
        forRepository {
            ivy {
                if (celeritasAssetDir != null) {
                    name = 'CeleritasAssetLocal'
                    url = file(celeritasAssetDir)
                    patternLayout { artifact '[artifact].[ext]' }
                } else {
                    name = 'CeleritasAutoBuildReleases'
                    url = 'https://github.com/kappa-maintainer/Celeritas-auto-build/releases/download'
                    patternLayout { artifact '[revision]/[artifact].[ext]' }
                }
                metadataSources { artifact() }
            }
        }
        filter {
            includeGroup('io.github.kappa-maintainer')
        }
    }
    // CurseForge files, through CleanroomMC's CurseMaven mirror (as the mod template does).
    exclusiveContent {
        forRepository {
            maven {
                name = 'CurseMaven'
                url = 'https://curse.cleanroommc.com'
            }
        }
        filter {
            includeGroup('curse.maven')
        }
    }
    // CodeChickenLib's MCP-named build, which Cleanroom's Maven hosts outside the groups the settings plugin routes there.
    exclusiveContent {
        forRepository {
            maven {
                name = 'CleanroomMCCodeChicken'
                url = 'https://maven.cleanroommc.com'
            }
        }
        filter {
            includeGroup('codechicken')
        }
    }
    // Modrinth's Maven: every coordinate in group maven.modrinth (Fluidlogged API, RenderLib,
    // EntityCulling, Gnetum).
    exclusiveContent {
        forRepository {
            maven {
                name = 'Modrinth'
                url = 'https://api.modrinth.com/maven'
            }
        }
        filter {
            includeGroup('maven.modrinth')
        }
    }
}

def diagnosticsProject = project(':diagnostics')

// The diagnostics' classes and resources in one directory, for the dev client. Cleanroom pairs every dev class directory
// with one resource directory, the last it finds; a second resources/main would take the place of Demonica's own, and
// with it Demonica's mcmod.info and assets. It takes a directory for classes by its name, as for the embedded classes.
def diagnosticsDevDir = layout.buildDirectory.dir('diagnostics-classes/main')
def syncDiagnosticsDev = tasks.register('syncDiagnosticsDev', Sync) {
    from diagnosticsProject.sourceSets.main.output
    into diagnosticsDevDir
}

// Chunk Animator's coremod reads SRG-to-MCP names in a deobfuscated workspace (its MCPNames, IN_MCP) from
// ./../mcp/methods.csv and ./../mcp/fields.csv relative to the client's working directory, run/client, and its class
// transformer crashes at class init when they are missing. -PwithCompatMods unpacks the MCP stable_39 CSVs (from
// Cleanroom's Maven) into run/mcp before the client runs. run/ is ignored.
def chunkAnimatorMcpMappings = configurations.detachedConfiguration(
    dependencies.create('de.oceanlabs.mcp:mcp_stable:39-1.12@zip')
)
def prepareChunkAnimatorMcpMappings = tasks.register('prepareChunkAnimatorMcpMappings', Copy) {
    group = 'build'
    description = "Unpacks the MCP stable_39 CSVs that Chunk Animator's coremod reads in a dev run into run/mcp."
    from({ zipTree(chunkAnimatorMcpMappings.singleFile) }) {
        include 'methods.csv', 'fields.csv'
    }
    into layout.projectDirectory.dir('run/mcp')
}

// The diagnostics jar's classes, loaded like the mod's own. -PwithoutDiagnostics: run what a player has without the
// companion jar.
def withDiagnostics = project.findProperty('withoutDiagnostics') == null

/*
 * The dev client's mods: Cleanroom loads them from -Dcrl.dev.extrapath, as in production where no mod jar is on
 * java.class.path (docs/celeritas/SPIKE.md). They are the mod's own output (the merged GLSM, Iris and S8TNLib classes
 * included), the jars of devRuntimeMods (the pinned Celeritas's dev remap, and the raw jars of the
 * -PwithCompatMods/-PwithHudCache/-PwithModernSplash/-PwithOpenComputers mods), and the diagnostics' classes unless -PwithoutDiagnostics. Resolved when the client starts.
 */
def devExtraPath = provider {
    def extraPaths = new LinkedHashSet<String>(sourceSets.main.output.files.collect { it.absolutePath })
    extraPaths.addAll(configurations.devRuntimeMods.files.collect { it.absolutePath })
    if (project.findProperty('withoutCeleritas') != null) {
        // -PwithoutCeleritas: check what a player sees when Celeritas is missing.
        extraPaths.removeIf { it.contains('celeritas-forge-mc12.2') }
    }
    if (withDiagnostics) {
        extraPaths.add(diagnosticsDevDir.get().asFile.absolutePath)
    }
    extraPaths.join(File.pathSeparator)
}

cleanroom {
    runs {
        client {
            configure {
                username = minecraft_username
                args '--width', '1280', '--height', '720'
                workingDir = file('run/client')
                jvmArgs extra_jvm_args.tokenize()
                jvmArgs = jvmArgs.findAll { !it.toString().startsWith('-Xmx') }
                maxHeapSize = '6G'
                // Mod classes, including the merged S8TNLib, GLSM and Iris outputs, stay off the JavaExec classpath (the
                // app class loader), where CleanroomGradle puts the main runtime classpath, and reach Cleanroom only
                // through -Dcrl.dev.extrapath. A class loaded by both would fail with a LinkageError
                // (docs/celeritas/SPIKE.md, "Dev class loading"); verifyRunClasspath checks it.
                def builtInClasspath = files(classpath.from)
                def modOutputs = sourceSets.main.output
                classpath = builtInClasspath.filter { !modOutputs.contains(it) }
                systemProperty 'crl.dev.extrapath', devExtraPath
                systemProperty 'fml.coreMods.load', coremod_plugin_class +
                    (withDiagnostics ? ',com.demonica.diagnostics.DiagnosticsCoremod' : '')
                if (withDiagnostics) {
                    dependsOn syncDiagnosticsDev
                }
                // The jars of the extrapath that a task builds (remapCeleritasForDev).
                dependsOn configurations.devRuntimeMods
                if (project.findProperty('withCompatMods') != null) {
                    dependsOn prepareChunkAnimatorMcpMappings
                }

                // -PdevScript=@path/to/script drives the client (com.demonica.diagnostics.dev.DevHarness, in the
                // diagnostics jar).
                def script = project.findProperty('devScript')
                if (script != null) {
                    systemProperty 'demonica.dev.script', script.toString()
                }
                if (project.findProperty('mixinVerbose') != null) {
                    systemProperty 'mixin.debug.verbose', 'true'
                }
                // -PdevProps=key=value[,key=value...]: further system properties, e.g. demonica.celeritas.pinsOnly=true.
                // A value may hold a comma-separated list: only a comma before the next key= separates.
                def devProps = project.findProperty('devProps')
                if (devProps != null) {
                    devProps.toString().split(/,(?=[\w.-]+=)/).each { entry ->
                        def parts = entry.split('=', 2)
                        systemProperty parts[0], parts.length > 1 ? parts[1] : 'true'
                    }
                }
            }
        }
    }
}

// Foundation (Cleanroom's class loading) needs it in a dev run (from the mod template: "fundamental Foundation issue").
tasks.withType(JavaExec).configureEach {
    systemProperty 'foundation.loadsall', 'true'
}

// The distributed diagnostics jar, which :diagnostics' reobfJar writes into this project's build/libs.
tasks.named('assemble').configure {
    dependsOn ':diagnostics:reobfJar'
}

configurations {
    voxelMap {
        transitive = false
    }
}

tasks.register('voxelMapWithoutMixin', Zip) {
    from(zipTree(configurations.voxelMap.singleFile)) {
        exclude 'org/spongepowered/**'
    }
    archiveFileName = 'voxelmap-without-mixin.jar'
    destinationDirectory = layout.buildDirectory.dir('compat')
}

dependencies {
    // The Minecraft and Cleanroom workspace (MCP names), with Demonica's access transformer applied. It brings LWJGL
    // 3.4.3 (SDL, no GLFW), lwjgly (the LWJGL2 API), JOML, ASM, fastutil, gson and the rest of Cleanroom's libraries.
    implementation cleanroom.userdev(cleanroom_version) {
        accessTransformers.from(access_transformers.tokenize().collect { "src/main/resources/META-INF/${it}" })
    }

    compileOnly project(':shader')

    // AGPL-3.0 (THIRD_PARTY_NOTICES.md). Not transitive: its POM brings the full ANTLR tool; antlr4-runtime below is
    // the only ANTLR the jar needs, pinned to 4.13.1, the version glsl-transformer's generated parser checks and its POM
    // names (Step 11; glsm/build.gradle has the same coordinate).
    contain('io.github.douira:glsl-transformer:3.0.0-pre3') {
        transitive = false
    }
    contain 'org.antlr:antlr4-runtime:4.13.1'
    contain('org.anarres:jcpp:1.4.14') {
        transitive = false
    }

    compileOnly "org.projectlombok:lombok:${lombokVersion}"
    annotationProcessor "org.projectlombok:lombok:${lombokVersion}"

    modCompileOnly deobf('curse.maven:distant-horizons-508933:9004743')  // Distant Horizons 3.3.3-1.12.2-forge
    // Mod compat (com.demonica.compat, com.demonica.mixin.mod), compiled against and loaded only when the mod is
    // present: mixin configs through MixinLate and mixins.demonica.conditions.properties, classes behind Mods flags.
    modCompileOnly deobf('curse.maven:botania-ceu-1179448:8706250')
    modCompileOnly deobf('curse.maven:chunk-animator-236484:3850023')  // Chunk Animator 1.12.2-1.2.1 (ChunkAnimatorCompat, C2)
    modCompileOnly deobf('curse.maven:cofh-core-69162:2920433')
    modCompileOnly deobf('curse.maven:extra-utilities-2-225561:2678374')
    modCompileOnly deobf('curse.maven:ichunutil-229060:2801262')
    modCompileOnly deobf('curse.maven:creativecore-257814:4722163')
    modCompileOnly deobf('curse.maven:littletiles-257818:5180387')
    // Lumenized: GregTech CEu's bloom and depth utilities, and CodeChickenLib's shader classes they use. Cleanroom's
    // Maven publishes CodeChickenLib MCP-named already (its -dev jar), so it is not deobf'd. The classifier names that jar:
    // the POM republished on 2026-10-15 lost the marker that sent Gradle to the module metadata (which names -dev.jar),
    // and without one the POM resolves CodeChickenLib-3.3.8.jar, which was never published.
    modCompileOnly deobf('curse.maven:gregtech-ce-unofficial-557242:5519022')
    modCompileOnly 'codechicken:CodeChickenLib:3.3.8:dev'
    modCompileOnly deobf('curse.maven:obscure-tooltips-715660:8522661')
    modCompileOnly deobf('curse.maven:oldresearchreborn-1632015:8642028')
    modCompileOnly deobf('curse.maven:scannable-266784:3146549')
    // VoxelMap's jar bundles an old Mixin, which would shadow Cleanroom's on the compile classpath: compile against a
    // copy without it (voxelMapWithoutMixin).
    voxelMap 'curse.maven:voxelmap-225179:3029445'
    compileOnly files(tasks.named('voxelMapWithoutMixin'))
    // CeleritasBlockAccess extends Fluidlogged API's interfaces, so code that calls a WorldSlice needs them.
    modCompileOnly(deobf('maven.modrinth:fluidlogged-api:3.0.6')) {
        transitive = false
    }
    // RevoUI (NeoFontRender's UI addons).
    modCompileOnly deobf('curse.maven:revo-ui-1620532:8593682')
    // Component Model Hider 1.0 (Multiblocked's block-model hiding API, driven by Modular Machinery CE).
    modCompileOnly deobf('curse.maven:component-model-hider-940949:4885858')
    // Not compiled against: StellarCoreHudCachingCompatTransformer's test and GLSM's redirector tests run over these
    // mods' classes (StellarCore's HUD caching, JourneyMap's grid colours). -PwithHudCache=stellarcore loads both.
    modCompileOnly deobf('curse.maven:stellarcore-1064321:8406201')
    modCompileOnly deobf('curse.maven:journeymap-32274:5172461')

    // The pinned upstream Celeritas mod (gradle.properties, docs/celeritas/PIN.md), as remapCeleritasForDev's
    // mixin-aware MCP remap of the Maven jar: the same jar for the compile and test classpaths and the dev client. Not
    // deobf(...), which leaves the mixins' annotations and members in SRG names.
    modCompileOnly celeritasDevJar
    devRuntimeMods celeritasDevJar
    // The same build's GitHub release asset, which the mod jar nests unmodified (bundledCeleritas, jar).
    bundledCeleritas bundledCeleritasCoordinate
    // GTNHLib, from the latest S8TNLib release (s8tnlibVersion, docs/FORK.md). :glsm and :shader compile against it
    // through the root project's compile classpath; mergeEmbeddedLibraryClasses puts its classes into the mod, so it is
    // never a runtime dependency of its own.
    modCompileOnly deobf("com.s8tnlib:s8tnlib:${s8tnlibVersion}")
    s8tnlibSources "com.s8tnlib:s8tnlib:${s8tnlibVersion}:sources"

    // -PwithCompatMods: the dev client also loads mods that Demonica has compat for, to check that the compat applies
    // (MixinLate's configs, C1, the fast renderer's gates). The heaviest (HBM, GregTech, Thaumcraft) are left out, and
    // RLFoliage, which needs FermiumBooter. Raw jars: Cleanroom remaps them as it loads them.
    if (project.findProperty('withCompatMods') != null) {
        // Not Distant Horizons: 3.3.0 called GLFW, which Cleanroom 0.7 does not ship. 3.3.3 (compiled against above)
        // runs on Cleanroom 0.7.4 in Prism, but not yet tried in the dev client (docs/compat/distant-horizons.md).
        devRuntimeMods 'curse.maven:chunk-animator-236484:3850023'  // needs run/mcp: prepareChunkAnimatorMcpMappings
        devRuntimeMods 'curse.maven:ichunutil-229060:2801262'
        devRuntimeMods 'curse.maven:creativecore-257814:4722163'
        devRuntimeMods 'curse.maven:littletiles-257818:5180387'
        devRuntimeMods 'curse.maven:snow-real-magic-308663:6275195'
        devRuntimeMods 'curse.maven:architecturecraft-tridev-277631:4344128'
        devRuntimeMods 'curse.maven:scannable-266784:3146549'
        devRuntimeMods 'curse.maven:fluxloading-1207328:7601634'
        devRuntimeMods 'curse.maven:extra-utilities-2-225561:2678374'
        // CodeChickenLib CRE 6898525 needs com.cleanroommc.hackery.ReflectionHackery, which Cleanroom 0.7 removed;
        // CoFH Core/World need CCL. Restore with a Cleanroom 0.7 CCL build, which in a dev run also needs the system
        // properties net.minecraftforge.gradle.GradleStart.srg.notch-srg (the Cleanroom universal jar's
        // deobf_data-1.12.2.tsrg) and net.minecraftforge.gradle.GradleStart.csvDir (run/mcp) on runClient.
        devRuntimeMods 'curse.maven:redstone-flux-270789:2920436'
        devRuntimeMods 'curse.maven:baubles-227083:2518667'
        devRuntimeMods 'curse.maven:botania-ceu-1179448:8706250'
        devRuntimeMods 'curse.maven:obscure-tooltips-715660:8522661'
        // RenderLib and EntityCulling (meldexun): EntityCulling's GL culling runs RenderLib's GL state save/restore
        // every entity pass, which the renderlib compat bridges to GLSM (#22). From Modrinth, which names the jars by
        // project id: in a deobf workspace EntityCulling's coremod drops every reparseable coremod jar whose file name
        // contains "renderlib", and FML then never finds the renderlib mod that EntityCulling itself requires.
        devRuntimeMods 'maven.modrinth:U0xnRzCg:vB2R8SDX'  // RenderLib 1.12.2-1.4.5
        devRuntimeMods 'maven.modrinth:MwYnBlwK:o94FuFEx'  // EntityCulling 1.12.2-6.5.0
    }
    // -PwithHudCache=stellarcore|gnetum: the dev client also loads one of the two HUD-caching mods whose caches
    // StellarCoreHudCachingCompatTransformer and GnetumHudCachingCompatTransformer bridge to GLSM. One at a time, and
    // not in -PwithCompatMods: both re-render the HUD into a cache, which would change every script's HUD shots.
    def hudCache = project.findProperty('withHudCache')
    if (hudCache == 'stellarcore') {
        devRuntimeMods 'curse.maven:stellarcore-1064321:8406201'
        // JourneyMap's minimap is where StellarCore's cache showed the scene through the map (Actinium's notes).
        devRuntimeMods 'curse.maven:journeymap-32274:5172461'
    } else if (hudCache == 'gnetum') {
        devRuntimeMods 'maven.modrinth:gnetum:1.4.3'
    } else if (hudCache != null) {
        throw new GradleException("-PwithHudCache takes stellarcore or gnetum, not '${hudCache}'")
    }
    // -PwithOpenComputers: the dev client also loads OpenComputers 1.8.10, whose screens draw their text through
    // display lists (script run/client/scripts/ocscreen.txt), with the Scala runtimes it needs on Cleanroom (Scalar,
    // Scalar Legacy) and Fugue, the same files as the Prism instance opencomputers-testing.
    if (project.findProperty('withOpenComputers') != null) {
        devRuntimeMods 'curse.maven:opencomputers-223008:8582726'
        devRuntimeMods 'curse.maven:scalar-legacy-1235372:6842491'
        devRuntimeMods 'curse.maven:scalar-1012168:8800375'
        devRuntimeMods 'curse.maven:fugue-1005815:9202433'
        // The Scala libraries the two Scalar jars nest (ContainedDeps). FML extracts those only from the mods
        // folder, into mods/1.12.2, never from the extrapath, so the dev client gets them unpacked here.
        def scalar = project.configurations.detachedConfiguration(
            project.dependencies.create('curse.maven:scalar-legacy-1235372:6842491'),
            project.dependencies.create('curse.maven:scalar-1012168:8800375'))
        scalar.transitive = false
        def scalarLibraries = project.layout.buildDirectory.dir('dev-scalar-libraries')
        def extractScalarLibraries = project.tasks.register('extractScalarLibraries', Sync) {
            from { scalar.files.collect { project.zipTree(it).matching { include '*.jar' } } }
            into scalarLibraries
        }
        devRuntimeMods project.files({ project.fileTree(scalarLibraries).files }).builtBy(extractScalarLibraries)
    }
    // -PwithModernSplash: the dev client also loads Modern Splash 1.5.3, a coremod that replaces FML's SplashProgress
    // and draws its text with colour 0 after a raw glColor4f (MixinFontRendererSplashColor).
    if (project.findProperty('withModernSplash') != null) {
        devRuntimeMods 'curse.maven:modern-splash-629058:8487408'
    }

    // JUnit, Mockito and AssertJ come from Conventions.
    testImplementation 'com.google.guava:guava:21.0'
    // Gnetum 1.4.3: GnetumHudCachingCompatTransformerTest runs the transformer over its GuiIngameForgeMixin bytes.
    testImplementation 'maven.modrinth:gnetum:1.4.3'
    testImplementation project(':shader')
    testImplementation files(sharedMinecraftCompileClasspath())
    // Celeritas's CeleritasBlockAccess extends Fluidlogged API interfaces, which Forge strips (@Optional.Interface)
    // when that mod is absent. Tests that load it, as BlockQuadTransformer's do, need them on the classpath, in the
    // MCP names the deobf'd Celeritas uses.
    testRuntimeOnly(deobf('maven.modrinth:fluidlogged-api:3.0.6')) {
        transitive = false
    }
}

/*
 * LWJGL's natives for this platform on the test runtime classpath: GLSM's buffer tests allocate through MemoryUtil,
 * which loads liblwjgl and, with lwjgl-jemalloc present, libjemalloc. They are the userdev's own natives variant, which
 * CleanroomGradle resolves at the userdev's LWJGL version into _cleanroomUserdevNatives and puts on runClient's class
 * path (after the runtime classpath). Not CleanroomGradle's lwjglNative, which needs a hand-written version and also
 * feeds runtimeClasspath, putting a second copy of the natives on runClient's class path. (runClient's
 * extractNatives is the vanilla LWJGL 2 set on java.library.path, which LWJGL 3 does not load.)
 */
def userdevNatives = configurations.findByName('_cleanroomUserdevNatives')
if (userdevNatives == null) {
    throw new GradleException("CleanroomGradle no longer has the _cleanroomUserdevNatives configuration the tests take " +
        "LWJGL's natives from; find where its userdev natives are resolved now and update build.gradle.")
}
dependencies {
    testRuntimeOnly files(userdevNatives)
}

/*
 * CleanroomGradle passes -Dmixin.debug.export=true and -Dmixin.checks.interfaces=true to every client run as JVM
 * arguments (not system properties), after this script's run configuration. -PmixinExport: write every class Mixin
 * transforms to run/client/.mixin.out, to inspect what the patches did to the bytecode; without it the export argument
 * is dropped, as it was opt-in before. The interface check stays on: it makes Mixin fail a mixin that does not
 * implement the interfaces it declares, which costs nothing at runtime worth avoiding in a dev client.
 */
tasks.named('runClient', JavaExec).configure {
    def mixinExport = project.findProperty('mixinExport') != null
    doFirst {
        if (!mixinExport) {
            jvmArgs = jvmArgs.findAll { !it.toString().startsWith('-Dmixin.debug.export=') }
        }
    }
}

// Celeritas's coremod registers client-only mixin targets; there is no server run. (runServer exists once
// cleanroom.userdev(...) has been declared.)
tasks.named('runServer').configure {
    enabled = false
}

// Forge's renamer adds fernflower_abstract_parameter_names.txt (a decompiler hint) to a jar whose abstract methods
// take parameters; the distributed jar has no use for it. Its map is mcp2srg.tsrg plus the mixins' own members
// (useMixinReobfMappings).
tasks.named('reobfJar').configure {
    additionalArgs.add('--disable-abstract-param')
}
useMixinReobfMappings(project)

// The Mixin annotation processor (CleanMix, added by CleanroomGradle) checks every mixin at compile time, which
// Unimined's jar-time remap never did, and its errors stay errors: a target without an SRG mapping must say so itself.
// Members FML, Forge or CodeChickenLib added have no SRG name and are marked remap = false where they are named
// (MixinSplashProgress, MixinTileEntityRendererDispatcherBatch, MixinMinecraftIrisLoadingComplete, FramebufferIrisMixin's
// stencilEnabled, MixinGlStateTracker), and so are Forge's added overloads updateRenderInfo(Entity, boolean) and
// setListener(Entity, float), which keep their MCP names in production (ActiveRenderInfoIrisMixin,
// EntityRendererIrisMixin and the diagnostics' EntityRendererDiagnosticsMixin and MinecraftDiagnosticsMixin). Only MIXIN_SOFT_TARGET_NOT_FOUND is a warning: the HBM and
// RenderLib mixins name their targets as strings because those mods are not on the compile classpath; they apply only
// when the mod is present. The processor's -AMSG_ switches are per message type, not per mixin, so a new soft target
// that is missing for another reason (a typo) only warns too. -AshowMessageTypes prints each message's type.
tasks.named('compileJava', JavaCompile).configure {
    options.compilerArgs.add('-AMSG_MIXIN_SOFT_TARGET_NOT_FOUND=warning')
    options.compilerArgs.add('-AshowMessageTypes=true')
}

processResources {
    duplicatesStrategy = DuplicatesStrategy.FAIL
}

// mcmod.info's @{TOKEN}s (tokens.properties). Token Envoy filters every processed resource and compiled string.
tokenEnvoy {
    set 'MOD_VERSION', project.version
    set 'MOD_AUTHORS', mod_authors.tokenize(',')*.trim().join('", "')
    set file('tokens.properties')
}

tasks.named('classes').configure {
    dependsOn mergeEmbeddedLibraryClasses
    dependsOn generateCeleritasPin
}

tasks.named('sourcesJar').configure {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    embeddedLibraryProjects.each { libraryProject ->
        from(libraryProject.sourceSets.main.allSource)
    }
    from({ configurations.s8tnlibSources.collect { zipTree(it) } }) {
        exclude s8tnlibExcludes
    }
    // The license texts and notices, as in the mod jar.
    from files('LICENSE', 'LICENSE-GPL-3.0.txt', 'LICENSE-LGPL-3.0.txt', 'THIRD_PARTY_NOTICES.md')
}

// Demonica is not a library: no Javadoc over 1100 files of mostly ported code, and no javadoc jar.
tasks.withType(Javadoc).configureEach {
    failOnError = false
}
tasks.named('javadoc').configure {
    enabled = false
}
tasks.named('javadocJar').configure {
    enabled = false
}

// Off (gradle.properties): Conventions reads neither switch itself.
tasks.withType(Checkstyle).configureEach {
    enabled = enable_checkstyle.toBoolean()
}
tasks.matching { it.name in ['clearSkiesCheck', 'formatJavaCheck'] }.configureEach {
    enabled = enable_formatting.toBoolean()
}

// Conventions names CleanroomMC as every jar's vendor; Demonica's are its author's.
tasks.withType(Jar).configureEach {
    manifest.attributes(
        'Implementation-Vendor': mod_authors,
        'Specification-Vendor': mod_authors,
        'Implementation-Vendor-Id': root_package
    )
}

tasks.named('jar', Jar).configure {
    // The MCP-named jar, for dev use only (Demonica-<version>-mcp.jar). build/libs holds only what is distributed:
    // reobfJar's SRG jar, the diagnostics jar and the sources jar.
    destinationDirectory = layout.buildDirectory.dir('devlibs')
    duplicatesStrategy = DuplicatesStrategy.FAIL
    // The manifest is written in doFirst; declare the inputs or the build cache can restore a stale one. The version is
    // read here, while the task is configured: Task.project at execution time is deprecated (Gradle 10).
    def modVersion = project.version.toString()
    inputs.property('version', modVersion)
    inputs.property('s8tnlibVersion', s8tnlibVersion)
    inputs.files(s8tnlibJar).withPropertyName('s8tnlibJar')
    inputs.files(configurations.bundledCeleritas).withPropertyName('bundledCeleritas')
    inputs.property('bundledCeleritasJarName', bundledCeleritasJarName)
    inputs.property('celeritasRelease', celeritasRelease)
    inputs.property('celeritasAssetSha256', celeritasAssetSha256)
    // A release asset can be replaced after the fact: never package one that is not exactly the pinned build.
    dependsOn 'verifyBundledCeleritasPin'

    into('/') {
        from configurations.contain
        // Byte for byte, under the name that encodes the pin (bundledCeleritasJarName).
        from(configurations.bundledCeleritas) {
            rename { bundledCeleritasJarName }
        }
    }

    // The license texts and the notices a binary copy must carry (THIRD_PARTY_NOTICES.md, "In the jars").
    from files('LICENSE', 'LICENSE-GPL-3.0.txt', 'LICENSE-LGPL-3.0.txt', 'THIRD_PARTY_NOTICES.md')

    doFirst {
        manifest {
            attributes(
                'ModType': 'CRL',
                'Implementation-Title': mod_name,
                'Implementation-Version': modVersion,
                'Implementation-Vendor': mod_authors,
                'Implementation-Vendor-Id': root_package,
                'Specification-Title': mod_name,
                'Specification-Version': modVersion,
                'Specification-Vendor': mod_authors,
                'FMLCorePlugin': coremod_plugin_class,
                'FMLCorePluginContainsFMLMod': 'true',
                'ForceLoadAsMod': 'true',
                'FMLAT': access_transformers,
                'ContainedDeps': (configurations.contain.collect { it.name } + bundledCeleritasJarName).join(' '),
                // The libraries need it. It also adds the extracted Celeritas to the class path, which is harmless
                // when it is used. When an installed Celeritas takes precedence, the hook deletes the extracted file
                // so that it never reaches the class path; when the hook did not run, MixinEarly's reconciliation
                // keeps FML from identifying it as a second Celeritas.
                'NonModDeps': 'true',
                // Cleanroom calls this class's bansoukou(List) with the mod candidates before it scans any coremod; it
                // drops the bundled Celeritas when the player installed one, and stale bundled copies of earlier pins
                // (docs/celeritas/PIN.md, "Bundled copy").
                'Bansoukou': 'com.demonica.loading.bundle.BundledCeleritasHook',
                // The bundled Celeritas: its name in the jar and in mods/1.12.2, its SHA-256, and its release.
                'Demonica-Celeritas-Jar': bundledCeleritasJarName,
                'Demonica-Celeritas-SHA256': celeritasAssetSha256,
                'Demonica-Celeritas-Release': celeritasRelease,
                // The S8TNLib release whose GTNHLib classes are merged in, and the commit it was built from.
                'S8TNLib-Version': s8tnlibVersion,
                'S8TNLib-Commit': new java.util.jar.JarFile(s8tnlibJar.singleFile).withCloseable {
                    it.manifest?.mainAttributes?.getValue('S8TNLib-Commit') ?: 'unknown'
                }
            )
        }
    }

    // The dev remap's hash (remapCeleritasForDev) is for dev runs only: a distributed jar trusts exactly the pins
    // (QuarantineGuard).
    filesMatching('META-INF/demonica/celeritas-pin') {
        filter { String line -> line.startsWith('dev_sha256=') ? null : line }
    }
}

def testRunDirectory = layout.projectDirectory.dir('run/test')

def prepareTestRunDirectory = tasks.register('prepareTestRunDirectory') {
    outputs.dir(testRunDirectory)
    doLast {
        mkdir(testRunDirectory)
    }
}

test {
    dependsOn prepareTestRunDirectory
    systemProperty 'demonica.projectRoot', rootProject.projectDir.absolutePath
    // Read from the project directory rather than the classpath: the patch ledger and its drafts (QuarantineLedgerTest)
    // and the pins (QuarantineGuardTest). Declared, so that editing them re-runs the tests instead of reusing a result.
    inputs.files('docs/celeritas/LEDGER.md', 'gradle.properties')
        .withPropertyName('projectFiles').withPathSensitivity(PathSensitivity.RELATIVE)
    inputs.dir('docs/celeritas/patches').withPropertyName('patchDrafts').withPathSensitivity(PathSensitivity.RELATIVE)
    useJUnitPlatform()
    workingDir = testRunDirectory.asFile
    // TransformCorpusReplayTest (docs/glsl-transformer_adoption/ADOPTION_PLAN.md, 3.5): the forked test JVM gets the
    // replay settings as system properties. Without -PglslCorpusDir the test replays the committed mini-corpus
    // (src/test/resources/transform-corpus, Step 8); -PglslCorpusDir=<abs> replays another;
    // -PglslReplayPatches=COMPOSITE,COMPUTE,...,COMPAT, -PglslReplayRecord=true and -PglslReplayThreads=N refine it.
    def glslCorpusDir = project.findProperty('glslCorpusDir') ?: ''
    systemProperty 'demonica.glsl.corpus.dir', glslCorpusDir
    systemProperty 'demonica.glsl.replay.patches', project.findProperty('glslReplayPatches') ?: ''
    systemProperty 'demonica.glsl.replay.record', project.findProperty('glslReplayRecord') ?: 'false'
    systemProperty 'demonica.glsl.replay.threads', project.findProperty('glslReplayThreads') ?: '0'
    if (glslCorpusDir) {
        // The corpus is read from outside the task's inputs, and record mode writes into it: never up to date, never
        // from the build cache. The replay prints its summary to standard out.
        outputs.upToDateWhen { false }
        outputs.cacheIf { false }
        testLogging {
            showStandardStreams = true
        }
    }
    javaLauncher = javaToolchains.launcherFor {
        languageVersion = JavaLanguageVersion.of(25)
    }
    if (project.findProperty('show_testing_output') == 'true') {
        testLogging {
            showStandardStreams = true
        }
    }
}

/**
 * A pinned mod jar must be exactly the pinned build, which only its SHA-256 identifies: Celeritas's version string
 * ("2.4.0-dev") is the same for every upstream dev build, and a release asset could be replaced. Registers a task that
 * resolves the coordinate and checks the jar against the comma-separated SHA-256 list in gradle.properties, and, when
 * exact is given, that it is that one of them: a jar that is shipped must be one build, not any accepted one.
 */
def registerPinCheck = { String taskName, String label, String coordinate, String pinsProperty, String doc,
                         String exact = null ->
    def pins = property(pinsProperty).toString().split(',')*.trim()*.toLowerCase() as Set
    tasks.register(taskName) {
        group = 'verification'
        description = "Checks that the resolved ${label} jar matches the SHA-256 pin in gradle.properties."

        def pinnedJar = configurations.detachedConfiguration(dependencies.create(coordinate)).tap {
            transitive = false
        }
        inputs.files(pinnedJar)
        inputs.property('pinned', pins)
        inputs.property('exact', exact ?: '')

        doLast {
            def jar = pinnedJar.singleFile
            def digest = java.security.MessageDigest.getInstance('SHA-256').digest(jar.bytes).encodeHex().toString()
            if (!(digest in pins)) {
                throw new GradleException("${jar.name} has SHA-256 ${digest}, which is not pinned in gradle.properties " +
                    "(${pinsProperty} = ${pins.join(', ')}). See ${doc} for how to move the pin.")
            }
            if (exact && digest != exact) {
                throw new GradleException("${jar.name} has SHA-256 ${digest}, which is pinned, but this jar must be " +
                    "exactly ${exact}. See ${doc} for how to move the pin.")
            }
            logger.lifecycle("${label} pin OK: ${jar.name} ${digest}")
        }
    }
}

def verifyCeleritasPin = registerPinCheck('verifyCeleritasPin', 'Celeritas', celeritasCoordinate, 'celeritas_sha256',
    'docs/celeritas/PIN.md')

// The release asset the mod jar bundles (celeritas_asset_sha256), from GitHub or -PceleritasAssetDir.
def verifyBundledCeleritasPin = registerPinCheck('verifyBundledCeleritasPin', 'Bundled Celeritas (release asset)',
    bundledCeleritasCoordinate, 'celeritas_sha256', 'docs/celeritas/PIN.md', celeritasAssetSha256)

/*
 * The pin's values for another Celeritas-auto-build release, to move the pin (docs/celeritas/PIN.md, "Moving the
 * pin"). -PceleritasCandidate=<tag> names the release, and latest, the default, asks GitHub for its latest one. The task
 * downloads the release's asset and the Maven jar of the same build into build/tmp/celeritasPinCandidate, hashes both,
 * and prints the gradle.properties lines and PIN.md rows. It edits nothing: the pin moves only when the properties do,
 * and the checks then judge the new values as they judge these.
 */
tasks.register('celeritasPinCandidate') {
    group = 'help'
    description = 'Prints the Celeritas pin for a Celeritas-auto-build release (-PceleritasCandidate=<tag|latest>).'
    def candidate = (project.findProperty('celeritasCandidate') ?: 'latest').toString().trim()
    def downloadDir = layout.buildDirectory.dir('tmp/celeritasPinCandidate')
    def autoBuildApi = 'https://api.github.com/repos/kappa-maintainer/Celeritas-auto-build/releases'
    def mavenBase = 'https://maven.outlands.top/releases/org/embeddedt/celeritas-forge-mc12.2'
    // It asks the network every time; nothing it prints may come from an earlier run.
    outputs.upToDateWhen { false }

    doLast {
        def tagPattern = /^commit-([0-9a-f]{40})-([0-9]{8}T[0-9]{6})$/
        if (candidate != 'latest' && !(candidate ==~ tagPattern)) {
            throw new GradleException("-PceleritasCandidate=${candidate} is neither latest nor a Celeritas-auto-build " +
                "tag (commit-<40-digit commit>-<yyyyMMddTHHmmss>).")
        }
        // As resolveS8tnlibVersion asks GitHub. GITHUB_TOKEN, when set, goes to GitHub's API only, never to the hosts
        // the downloads redirect to.
        def connect = { String url ->
            def connection = (HttpURLConnection) URI.create(url).toURL().openConnection()
            connection.connectTimeout = 10_000
            connection.readTimeout = 60_000
            connection.setRequestProperty('User-Agent', 'Demonica-build')
            if (url.startsWith('https://api.github.com/')) {
                connection.setRequestProperty('Accept', 'application/vnd.github+json')
                def token = System.getenv('GITHUB_TOKEN')
                if (token) {
                    connection.setRequestProperty('Authorization', "Bearer ${token}")
                }
            }
            return connection
        }
        def download = { String url, File target ->
            def connection = connect(url)
            if (connection.responseCode != HttpURLConnection.HTTP_OK) {
                return "${url} answered HTTP ${connection.responseCode}".toString()
            }
            target.bytes = connection.inputStream.withCloseable { it.bytes }
            return null
        }
        def sha256 = { File jar -> java.security.MessageDigest.getInstance('SHA-256').digest(jar.bytes).encodeHex().toString() }

        def releaseUrl = candidate == 'latest' ? "${autoBuildApi}/latest" : "${autoBuildApi}/tags/${candidate}"
        def releaseConnection = connect(releaseUrl.toString())
        if (releaseConnection.responseCode != HttpURLConnection.HTTP_OK) {
            throw new GradleException("${releaseUrl} answered HTTP ${releaseConnection.responseCode}.")
        }
        def release = releaseConnection.inputStream.withCloseable { new groovy.json.JsonSlurper().parse(it) }
        def tag = release.tag_name?.toString()
        def tagParts = ((tag ?: '') =~ tagPattern).with { it.matches() ? [it.group(1), it.group(2)] : null }
        if (tagParts == null) {
            throw new GradleException("The release ${tag} is not named commit-<40-digit commit>-<yyyyMMddTHHmmss>; " +
                "the auto-build changed its tags, and celeritas_release's check in build.gradle must follow.")
        }
        def assets = (release.assets ?: []).findAll { it.name ==~ /^01-celeritas-forge-mc12\.2-.*\.jar$/ }
        if (assets.size() != 1) {
            throw new GradleException("The release ${tag} has ${assets*.name ?: 'no asset'} for " +
                "01-celeritas-forge-mc12.2-*.jar, not exactly one.")
        }
        def asset = assets[0]
        def commit = tagParts[0]
        // The asset is named for upstream's version (2.5.0-dev), the Maven artifact for the auto-build's
        // (2.5.0-autobuild.<sha8>).
        def jarVersion = (asset.name =~ /^01-celeritas-forge-mc12\.2-(.+)\.jar$/)[0][1]
        def baseVersion = jarVersion.replaceFirst(/-dev$/, '')
        def mavenVersion = "${baseVersion}-autobuild.${commit.take(8)}".toString()

        def dir = downloadDir.get().asFile
        delete(dir)
        dir.mkdirs()
        def assetFile = new File(dir, asset.name.toString())
        def assetProblem = download(asset.browser_download_url.toString(), assetFile)
        if (assetProblem != null) {
            throw new GradleException("Cannot download the release asset: ${assetProblem}.")
        }
        def mavenFile = new File(dir, "celeritas-forge-mc12.2-${mavenVersion}.jar")
        def mavenProblem = download("${mavenBase}/${mavenVersion}/${mavenFile.name}".toString(), mavenFile)
        def assetSha256 = sha256(assetFile)
        def mavenSha256 = mavenProblem == null ? sha256(mavenFile) : null

        logger.lifecycle("""\
            |Celeritas-auto-build release ${tag} (upstream ${commit}), downloaded to ${dir}.
            |
            |gradle.properties:
            |celeritas_sha = ${commit}
            |celeritas_version = ${mavenVersion}
            |celeritas_sha256 = ${[mavenSha256, assetSha256].findAll().join(',')}
            |celeritas_release = ${tag}
            |celeritas_release_asset = ${asset.name}
            |celeritas_asset_sha256 = ${assetSha256}
            |
            |docs/celeritas/PIN.md, "Current pin":
            || Commit | `${commit}` |
            || Built by | [kappa-maintainer/Celeritas-auto-build](https://github.com/kappa-maintainer/Celeritas-auto-build), release `${tag}` |
            || Maven | `org.embeddedt:celeritas-forge-mc12.2:${mavenVersion}` on `https://maven.outlands.top/releases` |
            || SHA-256, Maven jar | `${mavenSha256 ?: 'not published'}` |
            || SHA-256, release asset `${asset.name}` | `${assetSha256}` |
            || Version string inside the jar | `${jarVersion}` |
            || Bundled as | the release asset, byte for byte, nested in the mod jar as `zz-demonica-bundled-celeritas-${commit.take(8)}-${tagParts[1]}.jar` |
            |""".stripMargin())
        if (mavenProblem != null) {
            // The build compiles against the Maven jar (verifyCeleritasPin, generateCeleritasPin), so the pin cannot
            // move to a build the auto-build has not published there.
            logger.warn("The Maven jar of this build is not available (${mavenProblem}): the pin cannot move to it " +
                "until it is.")
        }
    }
}

def verifyModuleBoundaries = tasks.register('verifyModuleBoundaries') {
    group = 'verification'
    description = 'Checks that no class is defined by more than one of the mod\'s projects, the diagnostics included.'
    dependsOn tasks.named('compileJava')
    dependsOn embeddedLibraryProjects.collect { it.tasks.named('classes') }
    dependsOn diagnosticsProject.tasks.named('classes')

    def componentOutputs = [
        demonica: files(tasks.named('compileJava', JavaCompile).get().destinationDirectory),
        glsm: project(':glsm').sourceSets.main.output.classesDirs,
        shader: project(':shader').sourceSets.main.output.classesDirs,
        diagnostics: diagnosticsProject.sourceSets.main.output.classesDirs
    ]

    doLast {
        def owners = [:]
        def duplicates = []

        componentOutputs.each { component, outputDirs ->
            outputDirs.files.findAll { it.exists() }.each { outputDir ->
                fileTree(outputDir).matching { include '**/*.class' }.files.each { classFile ->
                    def relativePath = outputDir.toPath().relativize(classFile.toPath()).toString().replace('\\', '/')
                    def previousOwner = owners.putIfAbsent(relativePath, component)
                    if (previousOwner != null && previousOwner != component) {
                        duplicates.add("${relativePath} (${previousOwner}, ${component})")
                    }
                }
            }
        }

        if (!duplicates.isEmpty()) {
            throw new GradleException("Duplicate classes cross module boundaries:\n - ${duplicates.sort().join('\n - ')}")
        }
    }
}

/**
 * The dev client loads the mod's classes (S8TNLib's GTNHLib, GLSM and Iris merged in), the diagnostics classes from
 * their own directory, and the mod jars of devRuntimeMods through -Dcrl.dev.extrapath. None of the mod's classes
 * may also be on runClient's class path, where the app class loader would load them and a call from the
 * LaunchClassLoader would fail with a LinkageError (docs/celeritas/SPIKE.md, "Dev class loading"), and S8TNLib's jar
 * must not be on the extrapath either, next to the merged copy. Checks: (a) no S8TNLib jar and no diagnostics output on
 * the class path; (b) nothing of the main source set's output on the class path; (c) no S8TNLib jar in the extrapath;
 * (d) every devRuntimeMods jar in the extrapath (but Celeritas with -PwithoutCeleritas). --info lists both.
 */
def verifyRunClasspath = tasks.register('verifyRunClasspath') {
    group = 'verification'
    description = 'Checks what runClient loads from its class path and what from -Dcrl.dev.extrapath.'

    def runClient = tasks.named('runClient', JavaExec)
    def diagnosticsOutputs = diagnosticsProject.sourceSets.main.output
    def diagnosticsDev = diagnosticsDevDir
    def mainOutput = sourceSets.main.output
    def devMods = configurations.devRuntimeMods
    def withoutCeleritas = project.findProperty('withoutCeleritas') != null

    doLast {
        def task = runClient.get()
        def classpath = task.classpath.files*.absolutePath
        def extraPath = (task.systemProperties['crl.dev.extrapath']?.toString() ?: '').tokenize(File.pathSeparator)
        logger.info("runClient class path:\n  ${classpath.join('\n  ')}")
        logger.info("runClient -Dcrl.dev.extrapath:\n  ${extraPath.join('\n  ')}")

        def isS8tnlibJar = { String path -> new File(path).name ==~ /s8tnlib-.*\.jar/ }
        def diagnosticsPaths = (diagnosticsOutputs.files*.absolutePath + diagnosticsDev.get().asFile.absolutePath) as Set
        def mainOutputPaths = mainOutput.files*.absolutePath as Set
        def problems = []
        classpath.findAll { isS8tnlibJar(it) || diagnosticsPaths.contains(it) }.each {
            problems << "on the class path: ${it}"
        }
        classpath.findAll { mainOutputPaths.contains(it) }.each {
            problems << "mod output on the class path: ${it}"
        }
        extraPath.findAll(isS8tnlibJar).each {
            problems << "in -Dcrl.dev.extrapath: ${it}"
        }
        devMods.files*.absolutePath.findAll { !(withoutCeleritas && it.contains('celeritas-forge-mc12.2')) }
            .findAll { !extraPath.contains(it) }.each {
                problems << "devRuntimeMods jar missing from -Dcrl.dev.extrapath: ${it}"
            }
        if (!problems.isEmpty()) {
            throw new GradleException("runClient must load the mod, the diagnostics and the dev mods only through " +
                "-Dcrl.dev.extrapath, and S8TNLib's classes only from the merged mod classes:\n - ${problems.join('\n - ')}")
        }
        logger.lifecycle("runClient: ${classpath.size()} class path entries, ${extraPath.size()} extrapath entries " +
            "(${extraPath.collect { new File(it).name }.join(', ')})")
    }
}


/**
 * The distributed (reobfJar, SRG-named) jar: a mod on upstream Celeritas that vendors no renderer. It must carry the mod, its
 * configs, S8TNLib's GTNHLib classes, its license files and contained libraries, and the hook that decides between the
 * bundled Celeritas and an installed one. It carries Celeritas only as the pinned release asset, unmodified (its exact
 * SHA-256), nested at the root under bundledCeleritasJarName and listed in ContainedDeps; every jar at the root must
 * be in ContainedDeps. It must never carry Celeritas's classes, services or assets at the top level, a renamed copy of
 * Celeritas, JOML, S8TNLib's own mod classes, or anything that would replace or shadow upstream's classes, services or
 * assets: the forbidden patterns are anchored at the root, so they do not reach into the nested jar.
 */
def verifyDistributedJar = tasks.register('verifyDistributedJar') {
    group = 'verification'
    description = 'Checks the contents and manifest of the reobfuscated (SRG) mod jar.'
    dependsOn tasks.named('reobfJar')

    def remappedJar = tasks.named('reobfJar').flatMap { it.output }
    def containedJars = provider { configurations.contain.collect { it.name } + bundledCeleritasJarName }
    def bundledCeleritas = [
        jar: bundledCeleritasJarName,
        sha256: celeritasAssetSha256,
        release: celeritasRelease
    ]
    def celeritasPin = [
        celeritas_sha: project.property('celeritas_sha').toString().trim(),
        celeritas_version: project.property('celeritas_version').toString().trim(),
        celeritas_sha256: (project.property('celeritas_sha256').toString().split(',')*.trim()*.toLowerCase() as Set)
    ]
    def expectedVersion = project.version.toString()
    inputs.file(remappedJar)
    inputs.property('version', expectedVersion)
    inputs.property('celeritasPin', celeritasPin.toString())
    inputs.property('bundledCeleritas', bundledCeleritas.toString())

    doLast {
        def jarFile = remappedJar.get().asFile
        def problems = []
        new java.util.jar.JarFile(jarFile).withCloseable { jar ->
            def names = jar.entries().findAll { !it.directory }.collect { it.name } as Set
            def forbidden = [
                ~/^org\/embeddedt\//, ~/^org\/taumc\//, ~/^dhj\//, ~/^com\/dhj\//, ~/^grondag\//, ~/^org\/joml\//,
                // S8TNLib's @Mod and coremod: only its GTNHLib classes are merged in (mergeEmbeddedLibraryClasses).
                ~/^com\/s8tnlib\//,
                ~/^assets\/celeritas\//, ~/^assets\/sodium\//,
                ~/^META-INF\/services\/org\.embeddedt\./,
                // The diagnostics live in the companion jar (verifyDiagnosticsJar).
                ~/^com\/demonica\/diagnostics\//, ~/^com\/demonica\/dev\//, ~/^mixins\.demonica\.diagnostics/,
                ~/^net\/coderbot\/iris\/celeritas\/debug\//, ~/^net\/coderbot\/iris\/debug\/flight\//,
                ~/\/GlStateDiffProbe/, ~/\/GpuCheckpointTracker/,
                ~/^META-INF\/services\/net\.coderbot\.iris\.debug\.DiagnosticsProvider/,
                // Angelica's GLStateManagerService layer, which nothing loaded.
                ~/^com\/mitchej123\/glsm\//, ~/^META-INF\/services\/com\.mitchej123\.glsm\./,
                // Jabel's @Desugar stub; the build targets Java 25, where records need no desugaring.
                ~/^com\/github\/bsideup\//
            ]
            names.each { name ->
                if (forbidden.any { name =~ it }) {
                    problems << "forbidden entry ${name}"
                }
            }
            def required = [
                'mcmod.info',
                // The license texts and notices (THIRD_PARTY_NOTICES.md, "In the jars").
                'LICENSE',
                'LICENSE-GPL-3.0.txt',
                'LICENSE-LGPL-3.0.txt',
                'THIRD_PARTY_NOTICES.md',
                'META-INF/demonica_at.cfg',
                'com/demonica/Demonica.class',
                'com/demonica/mixins/MixinEarly.class',
                // The manifest's Bansoukou class, which Cleanroom loads before any coremod.
                'com/demonica/loading/bundle/BundledCeleritasHook.class',
                'net/coderbot/iris/Iris.class',
                'com/gtnewhorizons/angelica/glsm/GLStateManager.class',
                'com/gtnewhorizon/gtnhlib/asm/ClassConstantPoolParser.class',
                // The no-op side of the diagnostics, which finds the companion jar.
                'net/coderbot/iris/debug/Diagnostics.class',
                'net/coderbot/iris/debug/DiagnosticsProvider.class',
                'net/coderbot/iris/debug/IrisGlDebug.class',
                'META-INF/services/com.gtnewhorizons.angelica.glsm.backend.RenderBackend',
                'mixins.demonica.core.json',
                'mixins.demonica.iris.json',
                'mixins.demonica.celeritas.json',
                'mixins.demonica.kirino.json',
                'mixins.demonica.hbm.early.json',
                // MixinLate reads it at startup and refuses to run without it.
                'mixins.demonica.conditions.properties',
                'mixins.demonica.distanthorizons.json',
                'mixins.demonica-refmap.json',
                // The Celeritas pin, which QuarantineGuard checks the installed jar against at startup.
                'META-INF/demonica/celeritas-pin',
                // Loaded by path at runtime (Celeritas's ShaderLoader): the shaders of Iris's CenterDepthSampler.
                'assets/angelica/shaders/centerDepth.vsh'
            ] + containedJars.get()
            (required - names).each { problems << "missing entry ${it}" }

            def manifest = jar.manifest.mainAttributes
            def expected = [
                'ModType': 'CRL',
                'Implementation-Title': 'Demonica',
                'Implementation-Version': expectedVersion,
                'Implementation-Vendor': 'Nicholas DellaGrotte',
                'Implementation-Vendor-Id': 'com.demonica',
                'Specification-Title': 'Demonica',
                'Specification-Version': expectedVersion,
                'Specification-Vendor': 'Nicholas DellaGrotte',
                'FMLCorePlugin': 'com.demonica.mixins.MixinEarly',
                'FMLCorePluginContainsFMLMod': 'true',
                'ForceLoadAsMod': 'true',
                'FMLAT': 'demonica_at.cfg',
                'NonModDeps': 'true',
                'Bansoukou': 'com.demonica.loading.bundle.BundledCeleritasHook',
                'Demonica-Celeritas-Jar': bundledCeleritas.jar,
                'Demonica-Celeritas-SHA256': bundledCeleritas.sha256,
                'Demonica-Celeritas-Release': bundledCeleritas.release
            ]
            expected.each { key, value ->
                if (manifest.getValue(key) != value) {
                    problems << "manifest ${key} is ${manifest.getValue(key)}, expected ${value}"
                }
            }
            ['S8TNLib-Version', 'S8TNLib-Commit'].each { key ->
                if (!manifest.getValue(key)) {
                    problems << "manifest has no ${key}"
                }
            }
            def contained = (manifest.getValue('ContainedDeps') ?: '').tokenize(' ') as Set
            if (contained != (containedJars.get() as Set)) {
                problems << "manifest ContainedDeps is ${contained}, expected ${containedJars.get()}"
            }
            // No jar at the root that Cleanroom would not extract: a stray one would be a Celeritas nobody checks.
            def rootJars = names.findAll { !it.contains('/') && it.endsWith('.jar') } as Set
            if (rootJars != contained) {
                problems << "the jars at the root are ${rootJars}, but ContainedDeps lists ${contained}"
            }
            // The bundled Celeritas byte for byte: exactly the pinned release asset, not merely an accepted build.
            def bundledEntry = jar.getEntry(bundledCeleritas.jar)
            if (bundledEntry != null) {
                def bundledSha256 = jar.getInputStream(bundledEntry).withCloseable {
                    java.security.MessageDigest.getInstance('SHA-256').digest(it.bytes).encodeHex().toString()
                }
                if (bundledSha256 != bundledCeleritas.sha256) {
                    problems << "${bundledCeleritas.jar} has SHA-256 ${bundledSha256}, expected celeritas_asset_sha256 " +
                        "${bundledCeleritas.sha256}"
                }
            }
            // The notices name the bundled Celeritas's source by its full commit, because gradle.properties is not in
            // the jar. Checking the copy the jar carries keeps that literal hash from going stale when the pin moves.
            def noticesEntry = jar.getEntry('THIRD_PARTY_NOTICES.md')
            if (noticesEntry != null) {
                def notices = jar.getInputStream(noticesEntry).withReader('UTF-8') { it.text }
                if (!notices.contains(celeritasPin.celeritas_sha)) {
                    problems << "THIRD_PARTY_NOTICES.md does not name the bundled Celeritas's commit, celeritas_sha " +
                        "${celeritasPin.celeritas_sha}"
                }
            }

            def metadata = new groovy.json.JsonSlurper().parse(jar.getInputStream(jar.getEntry('mcmod.info')))
            def mod = metadata[0]
            def requiredMods = ['celeritas']
            if (mod.modid != 'demonica' || mod.version != expectedVersion
                    || !(mod.dependencies as List).containsAll(requiredMods)
                    || !(mod.requiredMods as List).containsAll(requiredMods)) {
                problems << "mcmod.info must declare modid demonica, version ${expectedVersion} and require " +
                    "${requiredMods.join(' and ')}: ${mod}"
            }

            // Exactly the pins of gradle.properties, and nothing else: no dev_sha256, which only a dev run may trust.
            def pinEntry = jar.getEntry('META-INF/demonica/celeritas-pin')
            if (pinEntry != null) {
                def pin = new Properties()
                jar.getInputStream(pinEntry).withReader('UTF-8') { pin.load(it) }
                def unexpected = pin.stringPropertyNames() - celeritasPin.keySet()
                if (!unexpected.isEmpty()) {
                    problems << "META-INF/demonica/celeritas-pin has keys it must not have: ${unexpected}"
                }
                def pinnedSha256 = (pin.getProperty('celeritas_sha256') ?: '').split(',')*.trim()*.toLowerCase().findAll { it } as Set
                if (pinnedSha256 != celeritasPin.celeritas_sha256) {
                    problems << "META-INF/demonica/celeritas-pin pins ${pinnedSha256}, gradle.properties ${celeritasPin.celeritas_sha256}"
                }
                ['celeritas_sha', 'celeritas_version'].each { key ->
                    if (pin.getProperty(key)?.trim() != celeritasPin[key]) {
                        problems << "META-INF/demonica/celeritas-pin has ${key} ${pin.getProperty(key)}, gradle.properties ${celeritasPin[key]}"
                    }
                }
            }
        }
        if (!problems.isEmpty()) {
            throw new GradleException("${jarFile.name} failed verification:\n - ${problems.join('\n - ')}")
        }
    }
}

/**
 * The distributed diagnostics jar: only the companion's own classes (never a class of the mod, of Minecraft or of a
 * library), its mixin config with its own refmap, and the manifest and metadata that make it a coremod-flagged mod of
 * exactly the mod's version.
 */
def verifyDiagnosticsJar = tasks.register('verifyDiagnosticsJar') {
    group = 'verification'
    description = 'Checks the contents and manifest of the reobfuscated (SRG) diagnostics jar.'
    dependsOn ':diagnostics:reobfJar'

    // :diagnostics is configured after this project, so its reobfJar is looked up when the task graph is built.
    def remappedJar = provider { diagnosticsProject.tasks.named('reobfJar').get().output.get() }
    def expectedVersion = project.version.toString()
    inputs.file(remappedJar)
    inputs.property('version', expectedVersion)

    doLast {
        def jarFile = remappedJar.get().asFile
        def problems = []
        def config = 'mixins.demonica.diagnostics.json'
        def refmap = 'mixins.demonica.diagnostics-refmap.json'
        new java.util.jar.JarFile(jarFile).withCloseable { jar ->
            def names = jar.entries().findAll { !it.directory }.collect { it.name } as Set
            def allowed = [
                ~/^com\/demonica\/diagnostics\/.*\.class$/,
                ~/^META-INF\/MANIFEST\.MF$/,
                ~/^META-INF\/services\/net\.coderbot\.iris\.debug\.DiagnosticsProvider$/,
                ~/^mcmod\.info$/, ~/^mixins\.demonica\.diagnostics\.json$/,
                ~/^mixins\.demonica\.diagnostics-refmap\.json$/,
                // CleanMix's annotation processor writes it next to the refmap: each mixin's compatibility version.
                ~/^cleanmix_version_compatibility\.json$/,
                ~/^LICENSE$/, ~/^LICENSE-GPL-3\.0\.txt$/, ~/^LICENSE-LGPL-3\.0\.txt$/, ~/^THIRD_PARTY_NOTICES\.md$/
            ]
            names.findAll { name -> !allowed.any { name =~ it } }.each { problems << "unexpected entry ${it}" }
            def required = [
                'mcmod.info', config, refmap, 'LICENSE', 'LICENSE-GPL-3.0.txt', 'LICENSE-LGPL-3.0.txt',
                'THIRD_PARTY_NOTICES.md',
                'com/demonica/diagnostics/DiagnosticsCoremod.class',
                'com/demonica/diagnostics/DemonicaDiagnosticsMod.class',
                'com/demonica/diagnostics/DemonicaDiagnosticsProvider.class',
                'META-INF/services/net.coderbot.iris.debug.DiagnosticsProvider'
            ]
            (required - names).each { problems << "missing entry ${it}" }

            def manifest = jar.manifest.mainAttributes
            def expected = [
                'ModType': 'CRL',
                'FMLCorePlugin': 'com.demonica.diagnostics.DiagnosticsCoremod',
                'FMLCorePluginContainsFMLMod': 'true',
                'ForceLoadAsMod': 'true',
                'Implementation-Title': 'Demonica diagnostics',
                'Implementation-Version': expectedVersion,
                'Implementation-Vendor': 'Nicholas DellaGrotte'
            ]
            expected.each { key, value ->
                if (manifest.getValue(key) != value) {
                    problems << "manifest ${key} is ${manifest.getValue(key)}, expected ${value}"
                }
            }

            def slurper = new groovy.json.JsonSlurper()
            def mod = slurper.parse(jar.getInputStream(jar.getEntry('mcmod.info')))[0]
            def requirement = "demonica@[${expectedVersion}]".toString()
            if (mod.modid != 'demonica_diagnostics' || mod.version != expectedVersion
                    || !(mod.requiredMods as List).contains(requirement)) {
                problems << "mcmod.info must declare modid demonica_diagnostics, version ${expectedVersion} and " +
                    "require ${requirement}: ${mod}"
            }

            // Every mixin must be remapped: a refmap entry per mixin, since each one names Minecraft members.
            if (names.contains(config) && names.contains(refmap)) {
                def mixinConfig = slurper.parse(jar.getInputStream(jar.getEntry(config)))
                def mappings = slurper.parse(jar.getInputStream(jar.getEntry(refmap))).mappings ?: [:]
                def prefix = mixinConfig.package.replace('.', '/') + '/'
                ((mixinConfig.mixins ?: []) + (mixinConfig.client ?: [])).each { mixin ->
                    def internalName = prefix + mixin.replace('.', '/')
                    if (!mappings.containsKey(internalName)) {
                        problems << "${refmap} has no mappings for ${internalName}"
                    }
                }
            }
        }
        if (!problems.isEmpty()) {
            throw new GradleException("${jarFile.name} failed verification:\n - ${problems.join('\n - ')}")
        }
    }
}

/**
 * A call from the diagnostics to a Minecraft member through a root-project class (a root type that extends a Minecraft
 * class) stays in MCP names unless the diagnostics' reobfJar resolves the inherited member through the root classes on
 * its library path; when it does not, the call fails only in production. Rather than rely on that, the diagnostics call
 * Minecraft members only through Minecraft-typed references, and this finds any call that does not in the compiled
 * diagnostics classes.
 */
def verifyDiagnosticsRemap = tasks.register('verifyDiagnosticsRemap', JavaExec) {
    group = 'verification'
    description = 'Checks that the diagnostics reach no Minecraft member through a root-project class.'
    dependsOn diagnosticsProject.tasks.named('testClasses'), tasks.named('compileJava')

    def diagnosticsClasses = diagnosticsProject.sourceSets.main.output.classesDirs
    def rootClasses = tasks.named('compileJava', JavaCompile).flatMap { it.destinationDirectory }
    inputs.files(diagnosticsClasses).withPropertyName('diagnosticsClasses')
    inputs.files(rootClasses).withPropertyName('rootClasses')

    classpath = diagnosticsProject.sourceSets.test.runtimeClasspath
    mainClass = 'com.demonica.diagnostics.remap.InheritedMemberCheck'
    javaLauncher = javaToolchains.launcherFor {
        languageVersion = JavaLanguageVersion.of(25)
    }
    doFirst {
        args = [rootClasses.get().asFile.absolutePath] + diagnosticsClasses.files*.absolutePath
    }
}

/**
 * The SRG jars' mixins declare their @Shadow and @Overwrite members under the targets' SRG names (useMixinReobfMappings):
 * a member still named as in MCP is one Mixin will not find in production. For each mixin class the jar's mixin configs
 * list, and each target under net/minecraft/, this fails on a @Shadow or @Overwrite member whose name (without the
 * shadow prefix) is one mcp2srg.tsrg maps to an SRG name on the target or one of its superclasses and interfaces, read
 * from the compile classpath. Names mcp2srg.tsrg does not map are allowed: members Forge added (stencilEnabled),
 * targets outside Minecraft (Celeritas, CodeChickenLib and the other mods, which run in their own names). It also
 * fails when it examined no @Shadow/@Overwrite member, and when the same scan of the MCP-named jars (build/devlibs,
 * the canary) finds nothing to report, so it cannot pass vacuously.
 */
def verifyMixinReobf = tasks.register('verifyMixinReobf') {
    group = 'verification'
    description = 'Checks that no mixin in the SRG jars keeps an MCP-named @Shadow or @Overwrite member.'
    def jars = files(tasks.named('reobfJar').flatMap { it.output },
        provider { diagnosticsProject.tasks.named('reobfJar').get().output.get() })
    // The MCP-named jars reobfJar renames: the canary, where the same scan must find MCP-named members.
    def mcpJars = files(tasks.named('jar').flatMap { it.archiveFile },
        provider { diagnosticsProject.tasks.named('jar').get().archiveFile.get() })
    dependsOn tasks.named('reobfJar'), ':diagnostics:reobfJar'
    def mcpToSrg = tasks.named('extractUserdevMcpToSrg').flatMap { it.output }
    def minecraftClasspath = configurations.compileClasspath
    inputs.files(jars).withPropertyName('jars')
    inputs.files(mcpJars).withPropertyName('mcpJars')
    inputs.file(mcpToSrg).withPropertyName('mcpToSrg')
    inputs.files(minecraftClasspath).withPropertyName('minecraftClasspath').withNormalizer(CompileClasspathNormalizer)

    doLast {
        // owner -> MCP field name -> SRG name, and owner -> MCP name + descriptor -> SRG name.
        def fields = [:].withDefault { [:] }
        def methods = [:].withDefault { [:] }
        String owner = null
        mcpToSrg.get().asFile.eachLine('UTF-8') { String line ->
            if (line.isBlank() || line.startsWith('#')) {
                return
            }
            def parts = line.trim().split(' ')
            if (!line.startsWith('\t')) {
                owner = parts[0]
            } else if (parts.length == 2 && parts[0] != parts[1]) {
                fields[owner][parts[0]] = parts[1]
            } else if (parts.length == 3 && parts[0] != parts[2]) {
                methods[owner][parts[0] + parts[1]] = parts[2]
            }
        }
        // The Minecraft type hierarchy, from the class files on the compile classpath.
        def supertypes = [:]
        minecraftClasspath.files.findAll { it.isFile() && it.name.endsWith('.jar') }.each { File jar ->
            new java.util.zip.ZipFile(jar).withCloseable { zip ->
                zip.entries().findAll { it.name.startsWith('net/minecraft/') && it.name.endsWith('.class') }.each { entry ->
                    def reader = new ClassReader(zip.getInputStream(entry).withCloseable { it.bytes })
                    supertypes.putIfAbsent(reader.className, ([reader.superName] + (reader.interfaces as List)).findAll())
                }
            }
        }
        def hierarchy = { String target ->
            def seen = new LinkedHashSet<String>()
            def queue = [target]
            while (!queue.isEmpty()) {
                def next = queue.remove(0)
                if (next.startsWith('net/minecraft/') && seen.add(next)) {
                    queue.addAll(supertypes[next] ?: [])
                }
            }
            seen
        }
        def annotation = { List<AnnotationNode> annotations, String desc ->
            annotations?.find { it.desc == desc }
        }
        def value = { AnnotationNode node, String key ->
            def values = node?.values ?: []
            def index = (0..<values.size()).step(2).find { values[it] == key }
            index == null ? null : values[index + 1]
        }
        // CleanMix gives @Shadow and @Overwrite RUNTIME retention (RuntimeVisibleAnnotations) and @Mixin CLASS retention
        // (RuntimeInvisibleAnnotations): read both tables everywhere.
        def annotationsOf = { node -> (node.visibleAnnotations ?: []) + (node.invisibleAnnotations ?: []) }
        // One jar: [checked: mixins with a Minecraft target, members: @Shadow/@Overwrite members on them, problems].
        def scan = { File jarFile ->
            def problems = []
            def checked = 0
            def examined = 0
            new java.util.jar.JarFile(jarFile).withCloseable { jar ->
                def configs = jar.entries().findAll { it.name ==~ /mixins\.[^\/]*\.json/ && !it.name.contains('refmap') }
                configs.each { configEntry ->
                    def config = new groovy.json.JsonSlurper().parse(jar.getInputStream(configEntry))
                    if (!(config instanceof Map) || !config.package) {
                        return
                    }
                    def mixinNames = ['mixins', 'client', 'server'].collectMany { (config[it] ?: []) as List }
                    mixinNames.each { String mixinName ->
                        def path = (config.package + '.' + mixinName).replace('.', '/') + '.class'
                        def entry = jar.getEntry(path)
                        if (entry == null) {
                            problems << "${jarFile.name}: ${configEntry.name} lists ${mixinName}, which is not in the jar"
                            return
                        }
                        def node = new ClassNode()
                        new ClassReader(jar.getInputStream(entry).withCloseable { it.bytes }).accept(node, ClassReader.SKIP_CODE)
                        def mixin = annotation(annotationsOf(node), 'Lorg/spongepowered/asm/mixin/Mixin;')
                        def targets = ((value(mixin, 'value') ?: []).collect { ((Type) it).internalName } +
                            (value(mixin, 'targets') ?: []).collect { it.toString().replace('.', '/') })
                            .findAll { it.startsWith('net/minecraft/') }
                        if (targets.isEmpty()) {
                            return
                        }
                        checked++
                        def members = node.fields.collect { [it.name, null, annotationsOf(it)] } +
                            node.methods.collect { [it.name, it.desc, annotationsOf(it)] }
                        members.each { name, desc, annotations ->
                            def shadow = annotation(annotations, 'Lorg/spongepowered/asm/mixin/Shadow;')
                            def overwrite = annotation(annotations, 'Lorg/spongepowered/asm/mixin/Overwrite;')
                            if (shadow == null && overwrite == null) {
                                return
                            }
                            examined++
                            def prefix = shadow != null ? (value(shadow, 'prefix') ?: 'shadow$') : null
                            def plain = prefix != null && name.startsWith(prefix) ? name.substring(prefix.length()) : name
                            targets.each { target ->
                                def srg = hierarchy(target).findResult { type ->
                                    desc == null ? fields[type][plain] : methods[type][plain + desc]
                                }
                                if (srg != null) {
                                    problems << "${jarFile.name}: ${node.name}.${name}${desc ?: ''} " +
                                        "(${shadow != null ? '@Shadow' : '@Overwrite'} on ${target}) is still MCP-named, " +
                                        "expected ${srg}"
                                }
                            }
                        }
                    }
                }
            }
            [checked: checked, members: examined, problems: problems]
        }
        def results = jars.files.collect(scan)
        def checked = results.sum { it.checked } as int
        def examined = results.sum { it.members } as int
        def problems = results.collectMany { it.problems }
        if (checked == 0 || examined == 0) {
            throw new GradleException("verifyMixinReobf found ${checked} mixins with a Minecraft target and ${examined} " +
                '@Shadow/@Overwrite members on them in the jars; it checks nothing.')
        }
        if (!problems.isEmpty()) {
            throw new GradleException("Mixin members that reobfJar left in MCP names (useMixinReobfMappings):\n - " +
                problems.join('\n - '))
        }
        // The canary: the MCP-named jars must fail the same scan, or it cannot see an MCP-named member at all.
        def canary = mcpJars.files.sum { scan(it).problems.size() } as int
        if (canary == 0) {
            throw new GradleException('verifyMixinReobf found no MCP-named @Shadow/@Overwrite member in the MCP-named ' +
                'jars (build/devlibs) either, so it cannot detect one: the scan is broken.')
        }
        logger.lifecycle("verifyMixinReobf: ${checked} mixins with Minecraft targets, ${examined} @Shadow/@Overwrite " +
            "members, none MCP-named (canary: the MCP-named jars have ${canary})")
    }
}

tasks.named('check').configure {
    dependsOn verifyMixinReobf
    dependsOn verifyDiagnosticsJar
    dependsOn verifyDiagnosticsRemap
    dependsOn verifyCeleritasPin
    dependsOn verifyBundledCeleritasPin
    dependsOn verifyModuleBoundaries
    dependsOn verifyRunClasspath
    dependsOn verifyDistributedJar
}
