/*
 * Demonica: a shader mod for Minecraft 1.12.2 on Cleanroom, running on the separately installed upstream
 * Celeritas mod (docs/FORK.md, docs/celeritas/PIN.md).
 *
 * The root project holds the mod: com.demonica.* and Actinium's com.gtnewhorizons.angelica.* glue, derived from
 * actinium@4a19c959. :shader (the Iris tree) and :glsm are merged into its jar, and so is GTNHLib, from S8TNLib's
 * jar (com.s8tnlib:s8tnlib, pinned in gradle.properties). The distributed jar is the SRG-remapped output of
 * `remapJar`; verifyDistributedJar checks it.
 */
plugins {
    id 'java'
    id 'java-library'
    id 'xyz.wagyourtail.unimined' version '1.4.36-kappa'
}

group = property('demonica_group')
version = property('demonica_version')

base {
    archivesName = 'Demonica'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
    withSourcesJar()
}

configurations {
    // Libraries shipped as nested jars (ContainedDeps) inside the mod jar.
    contain
    implementation.extendsFrom(contain)
    modCompileOnly
    compileOnly.extendsFrom(modCompileOnly)
    modRuntimeOnly
    runtimeOnly.extendsFrom(modRuntimeOnly)
    // S8TNLib's jar and its sources jar, which the mod jar and its sources jar merge. Nothing compiles or runs against
    // them: :glsm and :shader depend on S8TNLib themselves.
    s8tnlib {
        transitive = false
    }
    s8tnlibSources {
        transitive = false
    }
}

def embeddedLibraryProjects = [
    project(':glsm'),
    project(':shader')
]

def mergedEmbeddedLibraryClassesDir = layout.buildDirectory.dir('embedded-library-classes/main')

ext.sharedMinecraftCompileClasspath = {
    rootProject.files(rootProject.provider {
        // Not the jars the mod's compat builds for itself (build/compat): the subprojects never use them.
        def compatJars = rootProject.layout.buildDirectory.dir('compat').get().asFile.toPath()
        rootProject.tasks.named('compileJava', JavaCompile).get().classpath.files.findAll {
            it.isFile() && !it.toPath().startsWith(compatJars)
        }
    })
}

// The subprojects' classes and resources, and S8TNLib's classes, become part of the mod's own output, so the jar and
// the dev runs see one mod, as in production.
def mergeEmbeddedLibraryClasses = tasks.register('mergeEmbeddedLibraryClasses', Sync) {
    duplicatesStrategy = DuplicatesStrategy.FAIL
    dependsOn embeddedLibraryProjects.collect { it.tasks.named('classes') }
    into mergedEmbeddedLibraryClassesDir

    embeddedLibraryProjects.each { libraryProject ->
        from(libraryProject.sourceSets.main.output)
    }
    // Everything in S8TNLib's jar but its manifest, which verifyS8tnlibPin reads.
    from({ configurations.s8tnlib.collect { zipTree(it) } }) {
        exclude 'META-INF/**'
    }
}

sourceSets.main.output.dir(mergedEmbeddedLibraryClassesDir, builtBy: mergeEmbeddedLibraryClasses)

/*
 * META-INF/demonica/celeritas-anchors: the Celeritas build the jar is made for and every anchor of the quarantine's
 * patches, extracted from the compiled mixins. QuarantineGuard reads it at startup, and checks the anchors when the
 * installed Celeritas is not the pinned build (docs/celeritas/LEDGER.md, "The guard").
 */
def generatedAnchorsDir = layout.buildDirectory.dir('generated/celeritas-anchors')
def generateCeleritasAnchors = tasks.register('generateCeleritasAnchors', JavaExec) {
    description = 'Extracts the anchors of the Celeritas patches from the compiled quarantine mixins.'
    def compiledClasses = tasks.named('compileJava', JavaCompile).flatMap { it.destinationDirectory }
    def quarantineConfig = file('src/main/resources/mixins.demonica.celeritas.json')
    // The jar the build compiles against (Unimined's MCP remap of the pin): its upstream mixins name the same members.
    def celeritasJar = configurations.compileClasspath.filter {
        it.name.startsWith('celeritas-forge-mc12.2-') && !it.name.endsWith('-sources.jar')
    }
    def outputFile = generatedAnchorsDir.map { it.file('META-INF/demonica/celeritas-anchors') }
    def pins = project.property('celeritas_sha256').toString()
    def upstreamCommit = project.property('celeritas_sha').toString()
    def celeritasVersion = project.property('celeritas_version').toString()

    dependsOn mergeEmbeddedLibraryClasses
    inputs.files(compiledClasses, mergedEmbeddedLibraryClassesDir).withPropertyName('classes')
    inputs.file(quarantineConfig).withPropertyName('config')
    inputs.files(celeritasJar).withPropertyName('celeritasJar')
    inputs.property('pins', pins)
    inputs.property('upstreamCommit', upstreamCommit)
    inputs.property('celeritasVersion', celeritasVersion)
    outputs.dir(generatedAnchorsDir)

    classpath = files(compiledClasses) + configurations.compileClasspath
    mainClass = 'com.demonica.celeritas.guard.AnchorExtractor'
    javaLauncher = javaToolchains.launcherFor {
        languageVersion = JavaLanguageVersion.of(25)
    }
    doFirst {
        delete(generatedAnchorsDir)
        args = [outputFile.get().asFile.absolutePath, quarantineConfig.absolutePath, celeritasJar.singleFile.absolutePath,
                upstreamCommit, celeritasVersion, pins,
                compiledClasses.get().asFile.absolutePath, mergedEmbeddedLibraryClassesDir.get().asFile.absolutePath]
    }
}

sourceSets.main.output.dir(generatedAnchorsDir, builtBy: generateCeleritasAnchors)

subprojects {
    apply plugin: 'java-library'
    group = rootProject.group
    version = rootProject.version

    // :glsm and :shader get S8TNLib as an api dependency, and :shader declares no repositories of its own.
    repositories {
        exclusiveContent {
            forRepository {
                mavenLocal()
            }
            filter {
                includeGroup('com.s8tnlib')
            }
        }
    }

    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(25)
        }
        sourceCompatibility = JavaVersion.VERSION_21
        targetCompatibility = JavaVersion.VERSION_21
    }

    dependencies {
        compileOnly rootProject.ext.sharedMinecraftCompileClasspath()
        annotationProcessor rootProject.files(rootProject.provider {
            rootProject.configurations.annotationProcessor.files.findAll { it.isFile() }
        })
    }

    tasks.withType(JavaCompile).configureEach {
        sourceCompatibility = '21'
        targetCompatibility = '21'
        options.encoding = 'UTF-8'
        options.release.set(21)
        javaCompiler = javaToolchains.compilerFor {
            languageVersion = JavaLanguageVersion.of(25)
        }
    }

    tasks.named('compileJava', JavaCompile).configure {
        options.fork = true
        options.forkOptions.jvmArgs.add('--sun-misc-unsafe-memory-access=allow')
    }

    tasks.withType(Javadoc).configureEach {
        failOnError = false
    }
}

repositories {
    // Celeritas's 1.12.2 mod, built from upstream commits by kappa-maintainer/Celeritas-auto-build
    // (docs/celeritas/PIN.md). Nothing else resolves from this repository.
    exclusiveContent {
        forRepository {
            maven {
                name = 'CeleritasAutoBuild'
                url = 'https://maven.outlands.top/releases'
            }
        }
        filter {
            includeModule('org.embeddedt', 'celeritas-forge-mc12.2')
        }
    }
    // S8TNLib, which its own build publishes to mavenLocal (README.MD). Nothing else resolves from mavenLocal.
    exclusiveContent {
        forRepository {
            mavenLocal()
        }
        filter {
            includeGroup('com.s8tnlib')
        }
    }
    mavenCentral()
    maven { url = 'https://maven.cleanroommc.com' }
    maven { url = 'https://cursemaven.com' }
    maven { url = 'https://api.modrinth.com/maven' }
    maven { url = 'https://nexus.gtnewhorizons.com/repository/public/' }
}

unimined.minecraft {
    version '1.12.2'

    mappings {
        mcp 'stable', '39-1.12'
    }

    cleanroom {
        accessTransformer file('src/main/resources/META-INF/demonica_at.cfg').absolutePath
        loader '0.6.12-alpha'
    }

    runs {
        // Celeritas's coremod registers client-only mixin targets; there is no server run.
        config('server') {
            enabled = false
        }
        all {
            args += ['--username', 'Developer', '--width', '1280', '--height', '720']
            workingDir = file('run/client')
            // Mod classes, including the merged S8TNLib, GLSM and Iris outputs, stay off the JavaExec classpath (the
            // app class loader) and reach Cleanroom through -Dcrl.dev.extrapath, as in production where the mod jar
            // is not on java.class.path (docs/celeritas/SPIKE.md). Unimined moves only the directories that exist at
            // configuration time, so this does it for all of them. verifyRunClasspath keeps S8TNLib's jar off both.
            def originalRunClasspath = classpath
            classpath = files(provider {
                def rawModuleOutputs = sourceSets.main.output.files
                originalRunClasspath.files.findAll { !rawModuleOutputs.contains(it) }
            })
            def extraPathArgument = '-Dcrl.dev.extrapath='
            def extraPaths = new LinkedHashSet<String>(sourceSets.main.output.files.collect { it.absolutePath })
            jvmArgs.findAll { it.toString().startsWith(extraPathArgument) }.each { argument ->
                extraPaths.addAll(argument.toString().substring(extraPathArgument.length()).tokenize(File.pathSeparator))
            }
            if (project.findProperty('withoutCeleritas') != null) {
                // -PwithoutCeleritas: check what a player sees when Celeritas is missing.
                extraPaths.removeIf { it.contains('celeritas-forge-mc12.2') }
            }
            jvmArgs = jvmArgs.findAll { !it.toString().startsWith(extraPathArgument) }
            jvmArgs += "${extraPathArgument}${extraPaths.join(File.pathSeparator)}"
            systemProperty 'fml.coreMods.load', 'com.demonica.mixins.MixinEarly'

            // -PdevScript=@path/to/script drives the client (com.demonica.dev.DevHarness).
            def script = project.findProperty('devScript')
            if (script != null) {
                systemProperty 'demonica.dev.script', script.toString()
            }
            if (project.findProperty('mixinVerbose') != null) {
                systemProperty 'mixin.debug.verbose', 'true'
            }
            // -PmixinExport: write every class Mixin transforms to run/client/.mixin.out, to inspect what the
            // patches did to the bytecode.
            if (project.findProperty('mixinExport') != null) {
                systemProperty 'mixin.debug.export', 'true'
            }
            // -PdevProps=key=value[,key=value...]: further system properties, e.g. demonica.perfDebug=true. A
            // value may hold commas (demonica.guard.drill=SHADOW,MESHING): only a comma before the next key= separates.
            def devProps = project.findProperty('devProps')
            if (devProps != null) {
                devProps.toString().split(/,(?=[\w.-]+=)/).each { entry ->
                    def parts = entry.split('=', 2)
                    systemProperty parts[0], parts.length > 1 ? parts[1] : 'true'
                }
            }
        }
    }

    defaultRemapJar = false

    // The distributed jar: the mod jar remapped to SRG, with the mixin refmaps generated.
    remap(tasks.named('jar').get()) {
        mixinRemap {
            enableBaseMixin()
            enableMixinExtra()
        }
    }

    mods {
        // Celeritas ships SRG-named mixins without a refmap, and uses MixinExtras. Its jar also
        // carries a leftover Fabric access widener in the 'named' namespace, which Forge ignores.
        remap([configurations.modCompileOnly, configurations.modRuntimeOnly]) {
            catchAWNamespaceAssertion()
            mixinRemap {
                enableBaseMixin()
                enableMixinExtra()
            }
        }
    }
}

tasks.named('preRunClient').configure {
    dependsOn tasks.named('classes')
}

tasks.named('runClient', JavaExec).configure {
    jvmArgs = jvmArgs.findAll { !it.startsWith('-Xmx') }
    maxHeapSize = '6G'
}

configurations {
    voxelMap {
        transitive = false
    }
}

tasks.register('voxelMapWithoutMixin', Zip) {
    from(zipTree(configurations.voxelMap.singleFile)) {
        exclude 'org/spongepowered/**'
    }
    archiveFileName = 'voxelmap-without-mixin.jar'
    destinationDirectory = layout.buildDirectory.dir('compat')
}

dependencies {
    def lwjglVersion = '3.4.1'
    def lombokVersion = '1.18.46'
    def asmVersion = '9.9.1'

    compileOnly project(':shader')
    // GTNHLib, from S8TNLib, for mergeEmbeddedLibraryClasses and sourcesJar. :shader puts it on the compile classpath.
    s8tnlib "com.s8tnlib:s8tnlib:${property('s8tnlib_version')}"
    s8tnlibSources "com.s8tnlib:s8tnlib:${property('s8tnlib_version')}:sources"

    contain('org.taumc:glsl-transformation-lib:0.2.0-32.g7dd88a4-GTNH') {
        transitive = false
    }
    contain 'org.antlr:antlr4-runtime:4.13.2'
    contain('org.anarres:jcpp:1.4.14') {
        transitive = false
    }

    compileOnly 'org.jetbrains:annotations:24.1.0'
    compileOnly "org.projectlombok:lombok:${lombokVersion}"
    annotationProcessor "org.projectlombok:lombok:${lombokVersion}"
    // Cleanroom ships JOML 1.10.9 at runtime. Celeritas's own copy is relocated (com.demonica.celeritas.CeleritasJoml).
    compileOnly 'org.joml:joml:1.10.9'
    compileOnly 'it.unimi.dsi:fastutil:8.5.18'
    compileOnly 'com.google.code.gson:gson:2.10.1'
    compileOnly "org.ow2.asm:asm:${asmVersion}"
    compileOnly "org.ow2.asm:asm-commons:${asmVersion}"
    compileOnly "org.ow2.asm:asm-tree:${asmVersion}"
    compileOnly "org.ow2.asm:asm-util:${asmVersion}"

    compileOnly "org.lwjgl:lwjgl:${lwjglVersion}"
    compileOnly "org.lwjgl:lwjgl-opengl:${lwjglVersion}"
    // Must stay after lwjgl and lwjgl-opengl: lwjglx ships LWJGL2-style GL11..GL45 (see requireLwjgl3BeforeLwjglx).
    compileOnly 'com.cleanroommc:lwjglx:1.0.0'

    modCompileOnly 'maven.modrinth:uCdwusMi:Sa0ttGJr'  // Distant Horizons 3.3.0-1.12.2
    // Mod compat (com.demonica.compat, com.demonica.mixin.mod), compiled against and loaded only when the mod is
    // present: mixin configs through MixinLate and mixins.demonica.conditions.properties, classes behind Mods flags.
    // NeverEnoughAnimation 1.0.7: its GUI fade scales item vertex alpha, which the fast lit item path must honour.
    modCompileOnly 'curse.maven:neverenoughanimation-1062347:7289408'
    modCompileOnly 'curse.maven:botania-ceu-1179448:8706250'
    modCompileOnly 'curse.maven:cofh-core-69162:2920433'
    modCompileOnly 'curse.maven:extra-utilities-2-225561:2678374'
    modCompileOnly 'curse.maven:gibbed-1480667:7737413'
    modCompileOnly 'curse.maven:ichunutil-229060:2801262'
    modCompileOnly 'curse.maven:creativecore-257814:4722163'
    modCompileOnly 'curse.maven:littletiles-257818:5180387'
    // Lumenized: GregTech CEu's bloom and depth utilities, and CodeChickenLib's shader classes they use.
    modCompileOnly 'curse.maven:gregtech-ce-unofficial-557242:5519022'
    modCompileOnly 'codechicken:CodeChickenLib:3.3.8'
    modCompileOnly 'curse.maven:obscure-tooltips-715660:8522661'
    modCompileOnly 'curse.maven:oldresearchreborn-1632015:8642028'
    modCompileOnly 'curse.maven:scannable-266784:3146549'
    // VoxelMap's jar bundles an old Mixin, which would shadow Cleanroom's on the compile classpath: compile against a
    // copy without it (voxelMapWithoutMixin).
    voxelMap 'curse.maven:voxelmap-225179:3029445'
    compileOnly files(tasks.named('voxelMapWithoutMixin'))
    // CeleritasBlockAccess extends Fluidlogged API's interfaces, so code that calls a WorldSlice needs them.
    modCompileOnly('maven.modrinth:fluidlogged-api:3.0.6') {
        transitive = false
    }
    // RevoUI (NeoFontRender's UI addons).
    modCompileOnly 'curse.maven:revo-ui-1620532:8593682'
    // Component Model Hider 1.0 (Multiblocked's block-model hiding API, driven by Modular Machinery CE).
    modCompileOnly 'curse.maven:component-model-hider-940949:4885858'
    // Not compiled against: the tests of StellarCoreHudCachingCompatTransformer and of GLSM's redirector run them over
    // these mods' classes (StellarCore's HUD caching, JourneyMap's grid colours).
    modCompileOnly 'curse.maven:stellarcore-1064321:8406201'
    modCompileOnly 'curse.maven:journeymap-32274:5172461'

    // The pinned upstream Celeritas mod (gradle.properties, docs/celeritas/PIN.md).
    modCompileOnly "org.embeddedt:celeritas-forge-mc12.2:${property('celeritas_version')}"
    modRuntimeOnly "org.embeddedt:celeritas-forge-mc12.2:${property('celeritas_version')}"

    // -PwithCompatMods: the dev client also loads mods that Demonica has compat for, to check that the compat applies
    // (MixinLate's configs, C1, the fast renderer's gates). The heaviest (HBM, GregTech, Thaumcraft) are left out, and
    // RLFoliage, which needs FermiumBooter.
    if (project.findProperty('withCompatMods') != null) {
        modRuntimeOnly 'maven.modrinth:uCdwusMi:Sa0ttGJr'  // Distant Horizons
        modRuntimeOnly 'curse.maven:ichunutil-229060:2801262'
        modRuntimeOnly 'curse.maven:creativecore-257814:4722163'
        modRuntimeOnly 'curse.maven:littletiles-257818:5180387'
        modRuntimeOnly 'curse.maven:neverenoughanimation-1062347:7289408'
        modRuntimeOnly 'curse.maven:snow-real-magic-308663:6275195'
        modRuntimeOnly 'curse.maven:architecturecraft-tridev-277631:4344128'
        modRuntimeOnly 'curse.maven:scannable-266784:3146549'
        modRuntimeOnly 'curse.maven:fluxloading-1207328:7601634'
        modRuntimeOnly 'curse.maven:extra-utilities-2-225561:2678374'
        modRuntimeOnly 'curse.maven:codechicken-lib-cre-1328922:6898525'
        modRuntimeOnly 'curse.maven:redstone-flux-270789:2920436'
        modRuntimeOnly 'curse.maven:cofh-core-69162:2920433'
        modRuntimeOnly 'curse.maven:cofh-world-271384:2920434'
        modRuntimeOnly 'curse.maven:baubles-227083:2518667'
        modRuntimeOnly 'curse.maven:botania-ceu-1179448:8706250'
        modRuntimeOnly 'curse.maven:obscure-tooltips-715660:8522661'
    }

    testImplementation 'org.junit.jupiter:junit-jupiter:6.0.3'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testImplementation 'com.google.guava:guava:21.0'
    // Gnetum 1.4.3: GnetumHudCachingCompatTransformerTest runs the transformer over its GuiIngameForgeMixin bytes.
    testImplementation 'maven.modrinth:gnetum:1.4.3'
    testImplementation project(':shader')
    testImplementation files(sharedMinecraftCompileClasspath())
    // Celeritas's CeleritasBlockAccess extends Fluidlogged API interfaces, which Forge strips (@Optional.Interface)
    // when that mod is absent. Tests that load it, as BlockQuadTransformer's do, need them on the classpath.
    testRuntimeOnly('maven.modrinth:fluidlogged-api:3.0.6') {
        transitive = false
    }
}

tasks.withType(JavaCompile).configureEach {
    sourceCompatibility = '21'
    targetCompatibility = '21'
    options.encoding = 'UTF-8'
    options.release.set(21)
    javaCompiler = javaToolchains.compilerFor {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

tasks.named('compileJava', JavaCompile).configure {
    options.fork = true
    options.forkOptions.jvmArgs.add('--sun-misc-unsafe-memory-access=allow')
}

/**
 * lwjglx ships LWJGL2-style org.lwjgl.opengl.GL11..GL45 classes. javac takes the first match on the
 * classpath, so if lwjglx precedes lwjgl-opengl 3 the build fails with hundreds of unrelated
 * "cannot find symbol glGetIntegerv" errors. This names the real cause instead. Gradle places a module
 * after its consumers, so lwjgl-opengl lands where lwjgl is declared: lwjglx must follow both.
 */
def requireLwjgl3BeforeLwjglx = { Task task ->
    def jars = task.classpath.files*.name
    def lwjglx = jars.findIndexOf { it ==~ /lwjglx-[0-9].*\.jar/ }
    def lwjglOpengl = jars.findIndexOf { it ==~ /lwjgl-opengl-3\.[0-9.]+\.jar/ }
    if (lwjglx >= 0 && lwjglOpengl >= 0 && lwjglx < lwjglOpengl) {
        throw new GradleException("${task.path}: ${jars[lwjglx]} precedes ${jars[lwjglOpengl]} on the compile " +
            "classpath, so javac would resolve LWJGL2-style GL classes. Keep compileOnly lwjglx declared " +
            "after lwjgl and lwjgl-opengl in build.gradle.")
    }
}

allprojects {
    tasks.withType(JavaCompile).configureEach {
        doFirst('requireLwjgl3BeforeLwjglx') { requireLwjgl3BeforeLwjglx(it) }
    }
}

processResources {
    def resourceProperties = [version: project.version.toString()]
    inputs.properties(resourceProperties)
    duplicatesStrategy = DuplicatesStrategy.FAIL
    filesMatching('mcmod.info') {
        expand(resourceProperties)
    }
}

tasks.named('classes').configure {
    dependsOn mergeEmbeddedLibraryClasses
    dependsOn generateCeleritasAnchors
}

tasks.named('sourcesJar').configure {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    embeddedLibraryProjects.each { libraryProject ->
        from(libraryProject.sourceSets.main.allSource)
    }
    from({ configurations.s8tnlibSources.collect { zipTree(it) } }) {
        exclude 'META-INF/**'
    }
    // The license texts and notices, as in the mod jar.
    from files('LICENSE', 'LICENSE-LGPL-3.0.txt', 'THIRD_PARTY_NOTICES.md')
}

jar {
    duplicatesStrategy = DuplicatesStrategy.FAIL
    // The manifest is written in doFirst; declare the inputs or the build cache can restore a stale one.
    inputs.property('version', project.version.toString())

    into('/') {
        from configurations.contain
    }

    // The license texts and the notices a binary copy must carry (THIRD_PARTY_NOTICES.md, "In the mod jar").
    from files('LICENSE', 'LICENSE-LGPL-3.0.txt', 'THIRD_PARTY_NOTICES.md')

    doFirst {
        manifest {
            attributes(
                'ModType': 'CRL',
                'Implementation-Title': 'Demonica',
                'Implementation-Version': project.version.toString(),
                'FMLCorePlugin': 'com.demonica.mixins.MixinEarly',
                'FMLCorePluginContainsFMLMod': 'true',
                'ForceLoadAsMod': 'true',
                'FMLAT': 'demonica_at.cfg',
                'ContainedDeps': configurations.contain.collect { it.name }.join(' '),
                'NonModDeps': 'true'
            )
        }
    }

    finalizedBy tasks.named('remapJar')
}

def testRunDirectory = layout.projectDirectory.dir('run/test')

def prepareTestRunDirectory = tasks.register('prepareTestRunDirectory') {
    outputs.dir(testRunDirectory)
    doLast {
        mkdir(testRunDirectory)
    }
}

test {
    dependsOn prepareTestRunDirectory
    systemProperty 'demonica.projectRoot', rootProject.projectDir.absolutePath
    // Read from the project directory rather than the classpath: the patch ledger and its drafts (QuarantineLedgerTest)
    // and the pins (AnchorInventoryTest). Declared, so that editing them re-runs the tests instead of reusing a result.
    inputs.files('docs/celeritas/LEDGER.md', 'gradle.properties')
        .withPropertyName('projectFiles').withPathSensitivity(PathSensitivity.RELATIVE)
    inputs.dir('docs/celeritas/patches').withPropertyName('patchDrafts').withPathSensitivity(PathSensitivity.RELATIVE)
    useJUnitPlatform()
    workingDir = testRunDirectory.asFile
    javaLauncher = javaToolchains.launcherFor {
        languageVersion = JavaLanguageVersion.of(25)
    }
    if (project.findProperty('show_testing_output') == 'true') {
        testLogging {
            showStandardStreams = true
        }
    }
}

def celeritasCoordinate = "org.embeddedt:celeritas-forge-mc12.2:${property('celeritas_version')}"
def celeritasPins = property('celeritas_sha256').toString().split(',')*.trim() as Set

/**
 * The Celeritas jar must be exactly the pinned build: its version string ("2.4.0-dev") is the same for every
 * upstream dev build, so only the SHA-256 identifies it (docs/celeritas/PIN.md).
 */
def verifyCeleritasPin = tasks.register('verifyCeleritasPin') {
    group = 'verification'
    description = 'Checks that the resolved Celeritas jar matches the SHA-256 pin in gradle.properties.'

    def coordinate = celeritasCoordinate
    def pinned = celeritasPins
    def pinnedJar = configurations.detachedConfiguration(dependencies.create(coordinate)).tap {
        transitive = false
    }
    inputs.files(pinnedJar)
    inputs.property('pinned', pinned)

    doLast {
        def jar = pinnedJar.singleFile
        def digest = java.security.MessageDigest.getInstance('SHA-256').digest(jar.bytes).encodeHex().toString()
        if (!(digest in pinned)) {
            throw new GradleException("${jar.name} has SHA-256 ${digest}, which is not pinned in gradle.properties " +
                "(celeritas_sha256 = ${pinned.join(', ')}). See docs/celeritas/PIN.md for how to move the pin.")
        }
        logger.lifecycle("Celeritas pin OK: ${jar.name} ${digest}")
    }
}

def s8tnlibPin = property('s8tnlib_commit').toString()

/**
 * The S8TNLib jar must be the pinned build. S8TNLib's build writes the commit it was built from into the jar's
 * manifest (S8TNLib-Commit, with -dirty if tracked files had changes), and gradle.properties pins that commit.
 */
def verifyS8tnlibPin = tasks.register('verifyS8tnlibPin') {
    group = 'verification'
    description = 'Checks that the resolved S8TNLib jar was built from the commit pinned in gradle.properties.'

    def pinned = s8tnlibPin
    def s8tnlibJar = configurations.s8tnlib
    inputs.files(s8tnlibJar)
    inputs.property('pinned', pinned)

    doLast {
        def jar = s8tnlibJar.singleFile
        def commit = new java.util.jar.JarFile(jar).withCloseable {
            it.manifest?.mainAttributes?.getValue('S8TNLib-Commit')
        }
        if (commit != pinned) {
            throw new GradleException("${jar.name} was built from S8TNLib commit ${commit}, but gradle.properties " +
                "pins s8tnlib_commit = ${pinned}. Publish S8TNLib to mavenLocal from that commit (README.MD).")
        }
        logger.lifecycle("S8TNLib pin OK: ${jar.name} ${commit}")
    }
}

/**
 * The distributed jar's patch anchors, checked as QuarantineGuard checks them in a real install: through the jar's
 * refmap, against the SRG-named pinned jar. On the pin the guard skips the check, so this is where its production
 * naming is proven (docs/celeritas/LEDGER.md, "The guard").
 */
def verifyProductionAnchors = tasks.register('verifyProductionAnchors', JavaExec) {
    group = 'verification'
    description = 'Checks the distributed jar\'s Celeritas patch anchors against the pinned jar in production names.'
    dependsOn tasks.named('remapJar'), tasks.named('testClasses')

    def remappedJar = tasks.named('remapJar').flatMap { it.archiveFile }
    def pinnedJar = configurations.detachedConfiguration(dependencies.create(celeritasCoordinate)).tap {
        transitive = false
    }
    inputs.file(remappedJar)
    inputs.files(pinnedJar)

    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.demonica.celeritas.guard.ProductionAnchorCheck'
    javaLauncher = javaToolchains.launcherFor {
        languageVersion = JavaLanguageVersion.of(25)
    }
    doFirst {
        args = [pinnedJar.singleFile.absolutePath, remappedJar.get().asFile.absolutePath]
    }
}

def verifyModuleBoundaries = tasks.register('verifyModuleBoundaries') {
    group = 'verification'
    description = 'Checks that no class is defined by more than one of the projects merged into the mod jar.'
    dependsOn tasks.named('compileJava')
    dependsOn embeddedLibraryProjects.collect { it.tasks.named('classes') }

    def componentOutputs = [
        demonica: files(tasks.named('compileJava', JavaCompile).get().destinationDirectory),
        glsm: project(':glsm').sourceSets.main.output.classesDirs,
        shader: project(':shader').sourceSets.main.output.classesDirs
    ]

    doLast {
        def owners = [:]
        def duplicates = []

        componentOutputs.each { component, outputDirs ->
            outputDirs.files.findAll { it.exists() }.each { outputDir ->
                fileTree(outputDir).matching { include '**/*.class' }.files.each { classFile ->
                    def relativePath = outputDir.toPath().relativize(classFile.toPath()).toString().replace('\\', '/')
                    def previousOwner = owners.putIfAbsent(relativePath, component)
                    if (previousOwner != null && previousOwner != component) {
                        duplicates.add("${relativePath} (${previousOwner}, ${component})")
                    }
                }
            }
        }

        if (!duplicates.isEmpty()) {
            throw new GradleException("Duplicate classes cross module boundaries:\n - ${duplicates.sort().join('\n - ')}")
        }
    }
}

/**
 * The dev client loads S8TNLib's classes from the merged mod classes, through -Dcrl.dev.extrapath (the runs above).
 * Its jar must not also be on runClient's class path, where the app class loader would load it and a call from the
 * LaunchClassLoader would fail with a LinkageError (docs/celeritas/SPIKE.md, "Dev class loading"), nor on the
 * extrapath.
 */
def verifyRunClasspath = tasks.register('verifyRunClasspath') {
    group = 'verification'
    description = 'Checks that no S8TNLib jar is on runClient\'s class path or in its -Dcrl.dev.extrapath.'

    def runClient = tasks.named('runClient', JavaExec).get()

    doLast {
        def isS8tnlibJar = { String path -> new File(path).name ==~ /s8tnlib-.*\.jar/ }
        def problems = runClient.classpath.files*.path.findAll(isS8tnlibJar).collect { "on the class path: ${it}" }
        def extraPathArgument = '-Dcrl.dev.extrapath='
        runClient.allJvmArgs.findAll { it.startsWith(extraPathArgument) }.each { argument ->
            argument.substring(extraPathArgument.length()).tokenize(File.pathSeparator).findAll(isS8tnlibJar).each {
                problems << "in -Dcrl.dev.extrapath: ${it}"
            }
        }
        if (!problems.isEmpty()) {
            throw new GradleException("runClient must get S8TNLib's classes only from the merged mod classes:\n" +
                " - ${problems.join('\n - ')}")
        }
    }
}

/**
 * The distributed (remapped) jar: a mod on upstream Celeritas that vendors no renderer. It must carry the mod, its
 * configs, its license files and contained libraries, and must never carry Celeritas, a renamed copy of it, JOML, or anything that
 * would replace or shadow upstream's classes, services or assets.
 */
def verifyDistributedJar = tasks.register('verifyDistributedJar') {
    group = 'verification'
    description = 'Checks the contents and manifest of the remapped mod jar.'
    dependsOn tasks.named('remapJar')

    def remappedJar = tasks.named('remapJar').flatMap { it.archiveFile }
    def containedJars = provider { configurations.contain.collect { it.name } }
    inputs.file(remappedJar)

    doLast {
        def jarFile = remappedJar.get().asFile
        def problems = []
        new java.util.jar.JarFile(jarFile).withCloseable { jar ->
            def names = jar.entries().findAll { !it.directory }.collect { it.name } as Set
            def forbidden = [
                ~/^org\/embeddedt\//, ~/^org\/taumc\//, ~/^dhj\//, ~/^com\/dhj\//, ~/^grondag\//, ~/^org\/joml\//,
                ~/^assets\/celeritas\//, ~/^assets\/sodium\//,
                ~/^META-INF\/services\/org\.embeddedt\./
            ]
            names.each { name ->
                if (forbidden.any { name =~ it }) {
                    problems << "forbidden entry ${name}"
                }
            }
            def required = [
                'mcmod.info',
                // The license texts and notices (THIRD_PARTY_NOTICES.md, "In the mod jar").
                'LICENSE',
                'LICENSE-LGPL-3.0.txt',
                'THIRD_PARTY_NOTICES.md',
                'META-INF/demonica_at.cfg',
                'com/demonica/Demonica.class',
                'com/demonica/mixins/MixinEarly.class',
                'me/flashyreese/mods/reeses_sodium_options/client/gui/SodiumVideoOptionsScreen.class',
                'assets/reeses-sodium-options/lang/en_us.lang',
                'net/coderbot/iris/Iris.class',
                'com/gtnewhorizons/angelica/glsm/GLStateManager.class',
                'com/gtnewhorizon/gtnhlib/asm/ClassConstantPoolParser.class',
                'META-INF/services/com.gtnewhorizons.angelica.glsm.backend.RenderBackend',
                'META-INF/services/com.mitchej123.glsm.GLStateManagerService',
                'mixins.demonica.core.json',
                'mixins.demonica.iris.json',
                'mixins.demonica.celeritas.json',
                'mixins.demonica.kirino.json',
                'mixins.demonica.hbm.early.json',
                // MixinLate reads it at startup and refuses to run without it.
                'mixins.demonica.conditions.properties',
                'mixins.demonica.distanthorizons.json',
                'mixins.demonica-refmap.json',
                // The pin and the patches' anchors, which QuarantineGuard checks at startup.
                'META-INF/demonica/celeritas-anchors',
                // Loaded by path at runtime (Celeritas's ShaderLoader): the shaders of Iris's CenterDepthSampler.
                'assets/angelica/shaders/centerDepth.vsh'
            ] + containedJars.get()
            (required - names).each { problems << "missing entry ${it}" }

            def manifest = jar.manifest.mainAttributes
            def expected = [
                'ModType': 'CRL',
                'FMLCorePlugin': 'com.demonica.mixins.MixinEarly',
                'FMLCorePluginContainsFMLMod': 'true',
                'ForceLoadAsMod': 'true',
                'FMLAT': 'demonica_at.cfg',
                'NonModDeps': 'true'
            ]
            expected.each { key, value ->
                if (manifest.getValue(key) != value) {
                    problems << "manifest ${key} is ${manifest.getValue(key)}, expected ${value}"
                }
            }
            def contained = (manifest.getValue('ContainedDeps') ?: '').tokenize(' ') as Set
            if (contained != (containedJars.get() as Set)) {
                problems << "manifest ContainedDeps is ${contained}, expected ${containedJars.get()}"
            }

            def metadata = new groovy.json.JsonSlurper().parse(jar.getInputStream(jar.getEntry('mcmod.info')))
            def mod = metadata[0]
            if (mod.modid != 'demonica' || !(mod.dependencies as List).contains('celeritas')
                    || !(mod.requiredMods as List).contains('celeritas')) {
                problems << "mcmod.info must declare modid demonica and require celeritas: ${mod}"
            }
        }
        if (!problems.isEmpty()) {
            throw new GradleException("${jarFile.name} failed verification:\n - ${problems.join('\n - ')}")
        }
    }
}

tasks.named('check').configure {
    dependsOn verifyCeleritasPin
    dependsOn verifyS8tnlibPin
    dependsOn verifyModuleBoundaries
    dependsOn verifyRunClasspath
    dependsOn verifyDistributedJar
    dependsOn verifyProductionAnchors
}
